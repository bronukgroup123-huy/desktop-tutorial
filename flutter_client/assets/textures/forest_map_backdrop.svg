    <path d="m55 180 19-14 23 6 18-9 27 17 7 19-13 13 4 17-24 15-22-8-21 11-23-14-5-19-10-12Z"/>
    <path d="m238 159 25-16 27 9 23-6 28 19 8 21-14 15 6 17-27 18-29-7-24 12-27-15-7-19-12-14Z"/>
