    <path d="m49 417 21-14 23 7 19-7 25 17 7 19-12 13 5 15-23 16-24-7-19 10-22-12-6-18-10-12Z"/>
    <path d="m207 396 25-16 27 8 23-6 29 19 9 22-15 14 6 19-26 17-30-7-23 11-27-14-7-20-12-13Z"/>
    <path d="m380 413 21-14 23 7 19-6 24 16 7 20-12 13 5 15-22 16-24-7-20 10-22-12-5-18-10-11Z"/>
  </g>

  <!-- Тонка топографіка: другорядна, не схожа на дороги функціональної карти. -->
  <g fill="none" stroke="#8fa184" stroke-width="1.25" opacity=".17" stroke-linecap="round">
    <path d="M0 123c54-26 91-25 136-4 47 23 88 21 132-4 49-28 91-27 142-2 39 19 69 20 102 7"/>
