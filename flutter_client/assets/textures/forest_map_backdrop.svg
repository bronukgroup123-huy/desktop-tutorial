  <!-- Декоративна, а не географічно точна підкладка поза областю. -->
  <rect width="512" height="512" fill="#edf0df"/>

  <!-- Невеликі різні за формою лісові масиви не конкурують з основною картою. -->
  <g id="forest-parcels" fill="#a9c49e" opacity=".16">
    <path d="M12 31 35 18l24 7 18-12 28 14 15 19-11 17 10 16-23 16-26-7-20 13-25-11-8-18L3 57Z"/>
    <path d="m165 65 18-14 23 5 17-8 25 14 7 19-12 12 5 13-20 14-24-8-17 8-21-12-7-19Z"/>
    <path d="m325 31 25-15 25 8 23-7 24 17 10 22-13 14 7 17-24 14-25-6-22 12-25-12-4-18-15-13Z"/>
    <path d="m55 180 19-14 23 6 18-9 27 17 7 19-13 13 4 17-24 15-22-8-21 11-23-14-5-19-10-12Z"/>
    <path d="m238 159 25-16 27 9 23-6 28 19 8 21-14 15 6 17-27 18-29-7-24 12-27-15-7-19-12-14Z"/>
    <path d="m389 168 20-13 21 7 18-6 20 15 5 18-11 12 4 13-19 16-22-7-17 9-22-12-5-17-10-10Z"/>
