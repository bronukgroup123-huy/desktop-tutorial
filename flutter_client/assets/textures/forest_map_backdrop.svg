      <path data-feature="lake" d="M283 257c8-6 20-4 25 3 5 8-1 17-11 19-11 3-22-2-23-10-1-4 3-9 9-12Z"/>
      <path data-feature="lake" d="M397 381c10-7 24-4 29 5 5 8-2 18-13 21-13 3-26-3-26-12 0-5 4-10 10-14Z"/>
    </g>
  </g>

  <!-- Тонка топографіка залишається другорядною та не схожа на дороги. -->
  <g id="contours" fill="none" stroke="#8fa184" stroke-width="1.25" opacity=".15" stroke-linecap="round">
    <path d="M0 123c54-26 91-25 136-4 47 23 88 21 132-4 49-28 91-27 142-2 39 19 69 20 102 7"/>
    <path d="M0 140c52-24 92-23 139-2 45 21 85 19 129-5 49-26 91-24 139 0 40 20 72 20 105 8"/>
    <path d="M0 257c45-19 82-17 121 2 48 23 93 22 140-2 48-24 93-22 139 1 40 20 76 20 112 4"/>
    <path d="M0 273c46-17 82-15 123 4 47 22 91 20 137-3 49-24 93-21 140 2 39 20 75 20 112 5"/>
    <path d="M0 383c52-25 95-22 139 2 43 23 84 22 127-1 48-26 94-25 143-1 39 20 70 20 103 7"/>
    <path d="M0 399c50-22 92-19 137 4 44 22 86 21 130-2 49-25 94-23 141 1 39 20 72 20 104 9"/>
  </g>

  <g id="trails" fill="none" stroke="#bf9c70" stroke-width="1.5" opacity=".22" stroke-linecap="round" stroke-dasharray="7 9">
    <path d="M16 231c57-34 109-30 154 2 46 33 94 34 142 3 51-33 108-34 184-1"/>
    <path d="M112 18c-25 61-20 111 13 151 34 42 35 89 4 135-32 48-34 101-6 190"/>
    <path d="M317 17c24 44 27 82 8 115-17 31-14 62 11 92"/>
