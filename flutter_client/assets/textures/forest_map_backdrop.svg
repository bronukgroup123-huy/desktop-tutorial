    <path d="m207 396 25-16 27 8 23-6 29 19 9 22-15 14 6 19-26 17-30-7-23 11-27-14-7-20-12-13Z"/>
    <path d="m380 413 21-14 23 7 19-6 24 16 7 20-12 13 5 15-22 16-24-7-20 10-22-12-5-18-10-11Z"/>
  </g>

  <!-- Галявини мають теплий відтінок і залишаються слабшими за межу області. -->
  <g id="meadows" fill="#f2efd9" stroke="#9eb58d" stroke-width="1" opacity=".62">
    <path data-feature="meadow" d="M37 43c10-9 25-8 34 1 7 7 5 18-5 24-13 8-31 2-34-9-2-6 0-11 5-16Z"/>
    <path data-feature="meadow" d="M189 72c8-8 23-9 33-2 9 6 8 18-1 25-11 9-29 6-36-3-5-7-3-14 4-20Z"/>
    <path data-feature="meadow" d="M348 48c11-8 28-5 34 5 6 9-1 18-13 22-14 4-28-3-29-13-1-5 2-10 8-14Z"/>
    <path data-feature="meadow" d="M258 181c9-10 26-11 37-3 10 7 8 20-3 27-14 8-33 3-38-8-3-6-1-11 4-16Z"/>
    <path data-feature="meadow" d="M26 328c10-9 26-8 36 1 8 7 5 19-6 25-14 7-31 1-34-10-2-6-1-11 4-16Z"/>
    <path data-feature="meadow" d="M339 321c9-10 27-11 38-2 9 8 5 20-7 26-14 7-32 1-35-10-2-5 0-10 4-14Z"/>
    <path data-feature="meadow" d="M224 419c11-9 29-7 37 3 7 9 1 20-12 24-15 5-31-3-32-14-1-5 2-10 7-13Z"/>
  </g>

  <!-- Вода схематична: вузькі потоки та маленькі озера без навігаційної претензії. -->
  <g id="water-features" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path data-feature="river" d="M0 334c43-20 67-18 102 2 38 22 75 21 111-3 40-27 79-27 119-2 37 24 70 25 105 4 28-17 50-17 75-1" stroke="#8fb8b0" stroke-width="4.5" opacity=".31"/>
    <path d="M0 334c43-20 67-18 102 2 38 22 75 21 111-3 40-27 79-27 119-2 37 24 70 25 105 4 28-17 50-17 75-1" stroke="#d8ebe4" stroke-width="1.5" opacity=".64"/>
    <path data-feature="stream" d="M420 0c-16 44-14 79 5 111 20 35 18 69-7 103-24 33-25 68-4 104 24 41 25 91 6 194" stroke="#91b9af" stroke-width="2.8" opacity=".26"/>
    <path data-feature="stream" d="M171 114c18 19 20 42 7 65-12 22-9 44 10 64 14 16 18 31 12 48" stroke="#91b9af" stroke-width="2" opacity=".23"/>
    <g fill="#b9d4ca" stroke="#769e96" opacity=".43">
