    </g>
    <g id="broadleaf">
      <path d="M-2 8h4v12h-4Z" fill="#92785d"/>
      <circle cx="0" cy="0" r="10" fill="#6f936e"/>
      <circle cx="-7" cy="3" r="6" fill="#789b76"/>
      <circle cx="7" cy="4" r="6" fill="#789b76"/>
    </g>
    <g id="shrub">
