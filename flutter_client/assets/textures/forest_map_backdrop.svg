    <path d="M0 399c50-22 92-19 137 4 44 22 86 21 130-2 49-25 94-23 141 1 39 20 72 20 104 9"/>
  </g>

  <!-- Дві легкі стежки дають відчуття карти, але не імітують точну навігацію. -->
