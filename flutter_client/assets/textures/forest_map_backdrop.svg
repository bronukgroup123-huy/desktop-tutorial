    </g>
    <g id="mushroom-brown">
      <path d="M-2 1c0 5-2 9-1 13 2 2 4 2 6 0 1-4-1-8-1-13Z" fill="#eee1c5" stroke="#8f7257" stroke-width="1"/>
      <path d="M-10 2c2-8 6-11 11-11s9 4 10 11C5 5-5 5-10 2Z" fill="#956247" stroke="#74503c" stroke-width="1"/>
    </g>
