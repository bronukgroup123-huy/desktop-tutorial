      <circle cx="3" cy="-5" r="1.1" fill="#f4ead9"/>
      <circle cx="6" cy="0" r="1" fill="#f4ead9"/>
    </g>
    <g id="mushroom-gold">
      <path d="M-2 0c0 5-2 9-1 13 2 2 4 2 6 0 1-4-1-8-1-13Z" fill="#eee0bd" stroke="#9a7850" stroke-width="1"/>
