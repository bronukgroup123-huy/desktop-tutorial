name: flutter_client
description: Грибний Радар — Flutter-клієнт (тонкий клієнт до Supabase Edge Functions v1-*)
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  flutter_riverpod: ^3.5.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  crypto: ^3.0.6
  maplibre_gl: ^0.28.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
    - assets/images/loading/
    - assets/icons/
    - assets/map/glyphs/noto_sans_regular/
