name: flutter_client
description: Грибний Радар — Flutter-клієнт (тонкий клієнт до Supabase Edge Functions v1-*)
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^18.1.4
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  crypto: ^3.0.6
  maplibre_gl: ^0.28.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  home_widget: ^0.10.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  camera: ^0.12.2
  onnxruntime: ^1.4.1
  image: ^4.13.1
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  sensors_plus: ^7.1.1
  flutter_local_notifications: ^22.3.3
  flutter_tts: ^4.2.5

dev_dependencies:
  # Лише для тестів (налаштування google_fonts у старих тестах); застосунок шрифти вбудовує (UI-004).
  google_fonts: ^6.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
    - assets/images/loading/
    - assets/icons/
    - assets/icons/tile/
    - assets/stickers/
    - assets/stickers/passport/
    - assets/species/large/
    - assets/species/small/
    - assets/trophies/large/
    - assets/trophies/small/
    - assets/avatars/
    - assets/textures/
    - assets/catalog/
    - assets/safety/
    - assets/map/glyphs/noto_sans_regular/
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Merriweather.txt
  # Вбудовані шрифти (UI-004): працюють офлайн з першого запуску, справжні ваги замість штучного
  # потовщення. SIL OFL 1.1; збірка — scripts/fonts/build.py.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
