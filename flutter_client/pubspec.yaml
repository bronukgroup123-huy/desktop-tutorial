name: flutter_client
description: Грибний Радар — Flutter-клієнт (тонкий клієнт до Supabase Edge Functions v1-*)
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  crypto: ^3.0.6
  maplibre_gl: ^0.28.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  home_widget: ^0.10.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  camera: ^0.12.2
  onnxruntime: ^1.4.1
  image: ^4.13.1
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  sensors_plus: ^7.1.1
  flutter_local_notifications: ^22.3.3
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
    - assets/images/loading/
    - assets/icons/
    - assets/stickers/
    - assets/species/large/
    - assets/species/small/
    - assets/trophies/large/
    - assets/trophies/small/
    - assets/catalog/
    - assets/safety/
    - assets/map/glyphs/noto_sans_regular/
