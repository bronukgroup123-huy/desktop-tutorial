name: mushroom_radar_client
description: API client for Mushroom Radar
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  go_router: ^10.0.0
  flutter_riverpod: ^2.4.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  dio: ^5.0.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  openapi_generator: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/uk.json
    - assets/i18n/en.json
    - assets/images/onboarding/
    - assets/images/loading/