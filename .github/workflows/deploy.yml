name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.1.4

      # Міграції — перед функціями: нові функції можуть залежати від нових RPC/таблиць.
      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      # Захист від розсинхрону історії міграцій: раніше міграції накочувались вручну,
      # тож supabase_migrations.schema_migrations на продакшні може бути неповною.
      # Деплой зупиняється ДО будь-яких змін у БД, якщо:
      #   - історія на сервері порожня (db push спробував би виконати ВСІ міграції заново);
      #   - є локальна міграція, старіша за останню застосовану (розрив в історії).
      # Як виправити: supabase migration repair --status applied <version> (docs/BACKEND_PLAN.md, B0.10).
      - name: Migrations — history guard
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD" | tee migrations.txt
          # CLI малює таблицю символом «│» і додає ANSI-кольори — нормалізуємо перед розбором.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/│/|/g' migrations.txt > migrations.clean.txt
          awk -F'|' 'NF>=2 {
              l=$1; r=$2; gsub(/[[:space:]]/,"",l); gsub(/[[:space:]]/,"",r);
              if (l ~ /^[0-9]+$/ && length(l) == 14) { if (r=="") print "PENDING " l; else print "APPLIED " l }
            }' migrations.clean.txt > status.txt
          applied=$(grep -c '^APPLIED' status.txt || true)
          last_applied=$(grep '^APPLIED' status.txt | awk '{print $2}' | sort | tail -1)
          echo "applied=$applied last_applied=${last_applied:-none}"
          grep '^PENDING' status.txt || echo "no pending migrations"
          if [ "$applied" -eq 0 ]; then
            echo "::error::Remote migration history is empty — refusing to re-run all migrations. Repair history first."
            exit 1
          fi
          stale=$(grep '^PENDING' status.txt | awk -v last="$last_applied" '$2 < last {print $2}')
          if [ -n "$stale" ]; then
            echo "::error::Pending migrations older than the last applied one ($last_applied): $stale"
            exit 1
          fi

      - name: Migrations — preview (dry run)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations — apply
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all Edge Functions (directories only)
        run: |
          for fn in $(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
            ! -name '_shared' ! -name 'guardian-notify-test' -exec basename {} \; | sort); do
            echo "▶ Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_ID" --no-verify-jwt
          done

      # ADR-022 §22.1, B4.9: Наглядач лише в застосунку — функції за кодом-посиланням (/s/<код>,
      # /rescue/<код>) і прийом SMS (B4.5) прибрано з репозиторію; видаляємо їх і з проєкту,
      # щоб старі посилання більше нічого не відкривали. Уже видалені — пропускаємо.
      - name: Delete link-based Guardian functions
        run: |
          for fn in guardian-session-get guardian-session-track guardian-session-gpx \
                    guardian-register-guardian-device guardian-rescue-get guardian-rescue-request \
                    guardian-webhook-sms; do
            supabase functions delete "$fn" --project-ref "$PROJECT_ID" >/dev/null 2>&1 \
              && echo "✗ Deleted $fn" || echo "· $fn already absent"
          done

      - name: Set Edge Function Secrets
        env:
          GUARDIAN_JWT_SECRET: ${{ secrets.GUARDIAN_JWT_SECRET }}
          FIREBASE_ENABLED: ${{ secrets.FIREBASE_ENABLED || 'false' }}
          SMS_ENABLED: ${{ secrets.SMS_ENABLED || 'false' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TURBOSMS_TOKEN: ${{ secrets.TURBOSMS_TOKEN }}
          TEXTBEE_ENABLED: ${{ secrets.TEXTBEE_ENABLED || 'false' }}
          TEXTBEE_API_KEY: ${{ secrets.TEXTBEE_API_KEY }}
          TEXTBEE_DEVICE_ID: ${{ secrets.TEXTBEE_DEVICE_ID }}
          # Тестування: сповіщення «Почалась хвиля» всім, не лише Pro / «Слідопит».
          WAVE_ALERTS_FOR_ALL: ${{ secrets.WAVE_ALERTS_FOR_ALL || 'false' }}
          # Повітряна тривога (alerts.in.ua, ADR-022 §22.5 п.5): лише якщо задано — не затирає ключ із панелі Supabase.
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          # Тривоги Наглядача в Telegram (ADR-022 §22.2, B4.11): бот від @BotFather. Лише якщо задано.
          GUARDIAN_TELEGRAM_BOT_TOKEN: ${{ secrets.GUARDIAN_TELEGRAM_BOT_TOKEN }}
          GUARDIAN_TELEGRAM_BOT_USERNAME: ${{ secrets.GUARDIAN_TELEGRAM_BOT_USERNAME }}
          GUARDIAN_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.GUARDIAN_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -n "$ALERTS_IN_UA_TOKEN" ]; then
            supabase secrets set ALERTS_IN_UA_TOKEN="$ALERTS_IN_UA_TOKEN" --project-ref "$PROJECT_ID"
          fi
          if [ -n "$GUARDIAN_TELEGRAM_BOT_TOKEN" ] && [ -n "$GUARDIAN_TELEGRAM_BOT_USERNAME" ] && [ -n "$GUARDIAN_TELEGRAM_WEBHOOK_SECRET" ]; then
            supabase secrets set \
              GUARDIAN_TELEGRAM_BOT_TOKEN="$GUARDIAN_TELEGRAM_BOT_TOKEN" \
              GUARDIAN_TELEGRAM_BOT_USERNAME="$GUARDIAN_TELEGRAM_BOT_USERNAME" \
              GUARDIAN_TELEGRAM_WEBHOOK_SECRET="$GUARDIAN_TELEGRAM_WEBHOOK_SECRET" \
              --project-ref "$PROJECT_ID"
            # Вебхук бота → v1-telegram-webhook (лише особисті повідомлення, із секретом у заголовку).
            curl -sS --fail -X POST "https://api.telegram.org/bot${GUARDIAN_TELEGRAM_BOT_TOKEN}/setWebhook" \
              --data-urlencode "url=https://${PROJECT_ID}.supabase.co/functions/v1/v1-telegram-webhook" \
              --data-urlencode "secret_token=${GUARDIAN_TELEGRAM_WEBHOOK_SECRET}" \
              --data-urlencode 'allowed_updates=["message"]' > /dev/null && echo "Telegram webhook set"
          fi
          supabase secrets set \
            GUARDIAN_JWT_SECRET="$GUARDIAN_JWT_SECRET" \
            GUARDIAN_BASE_URL="https://desktop-tutorial-eta-tan.vercel.app" \
            FIREBASE_ENABLED="$FIREBASE_ENABLED" \
            SMS_ENABLED="$SMS_ENABLED" \
            FIREBASE_SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_JSON" \
            TURBOSMS_TOKEN="$TURBOSMS_TOKEN" \
            TEXTBEE_ENABLED="$TEXTBEE_ENABLED" \
            TEXTBEE_API_KEY="$TEXTBEE_API_KEY" \
            TEXTBEE_DEVICE_ID="$TEXTBEE_DEVICE_ID" \
            WAVE_ALERTS_FOR_ALL="$WAVE_ALERTS_FOR_ALL" \
            --project-ref "$PROJECT_ID"
