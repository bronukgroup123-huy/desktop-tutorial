name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Repair migration history (one-time fix)
        run: |
          supabase migration repair --status reverted 20260910000000 || true
          supabase migration repair --status reverted 20260911000007 || true

      - name: Push database migrations
        run: supabase db push --yes --include-all

      - name: Deploy all Edge Functions (directories only)
        run: |
          for fn in $(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
            ! -name '_shared' ! -name 'guardian-notify-test' -exec basename {} \; | sort); do
            echo "▶ Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_ID" --no-verify-jwt
          done

      - name: Set Edge Function Secrets
        env:
          GUARDIAN_JWT_SECRET: ${{ secrets.GUARDIAN_JWT_SECRET }}
        run: |
          supabase secrets set \
            GUARDIAN_JWT_SECRET="$GUARDIAN_JWT_SECRET" \
            GUARDIAN_BASE_URL="https://desktop-tutorial-eta-tan.vercel.app" \
            FIREBASE_ENABLED="false" \
            SMS_ENABLED="false" \
            --project-ref "$PROJECT_ID"
