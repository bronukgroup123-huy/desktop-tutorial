name: Trails data

# Мережа доріг і стежок областей для маршруту «Додому» без інтернету (ADR-022 §22.7).
#
# Те саме вивантаження OpenStreetMap для України з Geofabrik, що й для лісів і карти:
# osmium за один прохід вирізає рамки всіх областей (з запасом ~5 км), далі для кожної —
# дороги, лісові дороги, стежки, мости й броди, вода й болота → граф `trails-<slug>.bin.gz`.
# Застосунок качає файл разом з офлайн-картою і прокладає маршрут на телефоні.
#
#  * Вручну: Actions → Trails data → `all` або slug області → реліз «trails-data».
#  * Щомісяця — 3-го числа, після «Forests data».
#  * PR, що змінює генератор: тести (без збірки й публікації).
# Дані: © OpenStreetMap contributors (ODbL); вивантаження — Geofabrik GmbH.
on:
  workflow_dispatch:
    inputs:
      region:
        description: '«all» — усі області, або slug однієї (zhytomyrska, kyivska, …)'
        required: true
        default: all
  schedule:
    - cron: '23 3 3 * *' # 3-го числа щомісяця, 03:23 UTC
  pull_request:
    paths:
      - 'scripts/trails/**'
      - '.github/workflows/trails.yml'

permissions:
  contents: read

concurrency:
  group: trails-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'publish' }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  PBF_URL: https://download.geofabrik.de/europe/ukraine-latest.osm.pbf

jobs:
  test:
    name: Generator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/trails
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config deno.json -A lib.test.ts
      - run: deno check --config deno.json build_region.ts regions_config.ts

  build:
    name: Build trails (${{ github.event.inputs.region || 'all' }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      REGION: ${{ github.event.inputs.region || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase public config
        uses: ./.github/actions/supabase-public-config
        with:
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Check region input
        run: |
          if [ "$REGION" != "all" ] && ! printf '%s' "$REGION" | grep -Eq '^[a-z0-9-]{2,40}$'; then
            echo "::error::Некоректний slug області: $REGION"; exit 1
          fi

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version | head -1

      - name: Cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: osm/ukraine-latest.osm.pbf
          key: geofabrik-ukraine-${{ steps.week.outputs.week }}

      - name: Download Ukraine extract (Geofabrik)
        run: |
          mkdir -p osm
          if [ ! -s osm/ukraine-latest.osm.pbf ]; then
            curl -fsSL --retry 5 --retry-delay 30 -A "MushroomRadar-trails-builder/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              -o osm/ukraine-latest.osm.pbf "$PBF_URL"
            curl -fsSL --retry 5 -o osm/ukraine-latest.osm.pbf.md5 "$PBF_URL.md5"
            (cd osm && sed 's#  .*#  ukraine-latest.osm.pbf#' ukraine-latest.osm.pbf.md5 | md5sum -c -)
          fi
          ls -lh osm/ukraine-latest.osm.pbf

      # Спершу лише потрібні теги для всієї України — далі вирізання областей швидке.
      - name: Filter roads, paths, water, wetlands (osmium)
        run: |
          osmium tags-filter osm/ukraine-latest.osm.pbf \
            w/highway wr/natural=water,wetland wr/landuse=reservoir,basin w/waterway=river,canal,riverbank \
            -o osm/trails.osm.pbf --overwrite
          ls -lh osm/trails.osm.pbf

      - name: Region frames
        run: |
          ONLY=""
          if [ "$REGION" != "all" ]; then ONLY="--only $REGION"; fi
          deno run --config scripts/trails/deno.json -A scripts/trails/regions_config.ts $ONLY --dir osm/regions > osm/extract.json
          jq '.extracts | length' osm/extract.json

      # По одній області: вирізання всіх 27 одним проходом (complete_ways) вичерпувало пам'ять
      # машини GitHub і її зупиняло. 27 коротких проходів по ~260 МБ — кілька хвилин.
      - name: Build region files
        run: |
          mkdir -p osm/regions
          jq -c '.extracts[]' osm/extract.json | while read -r ex; do
            slug=$(jq -r '.output' <<<"$ex" | sed 's/\.osm\.pbf$//')
            bbox=$(jq -r '.bbox | map(tostring) | join(",")' <<<"$ex")
            pbf="osm/regions/$slug.osm.pbf"
            osmium extract -b "$bbox" -s complete_ways osm/trails.osm.pbf -o "$pbf" --overwrite
            osmium export "$pbf" -f geojsonseq -o "osm/regions/$slug.geojsonseq" --overwrite
            deno run --config scripts/trails/deno.json --v8-flags=--max-old-space-size=6144 -A \
              scripts/trails/build_region.ts --input "osm/regions/$slug.geojsonseq" --slug "$slug" --out dist
            rm -f "osm/regions/$slug.geojsonseq" "$pbf"
          done

      - name: Summary
        run: |
          echo "### Мережа стежок: $(ls dist/trails-*.json | wc -l) областей" >> "$GITHUB_STEP_SUMMARY"
          echo "| Область | Вузлів | Ребер | км доріг | Через болото | Озер/водойм | Боліт | Річок | Розмір |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for m in dist/trails-*.json; do
            jq -r '"| \(.slug) | \(.stats.nodes) | \(.stats.edges) | \(.stats.length_km) | \(.stats.wet_edges) | \(.stats.water_polys) | \(.stats.wetland_polys) | \(.stats.river_lines) | \((.bytes/1048576*10|round)/10) МБ |"' "$m" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: trails-${{ env.REGION }}
          path: dist/
          retention-days: 14

      # Спершу дані, потім описи: застосунок читає опис і за ним — дані.
      - name: Publish to release «trails-data»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view trails-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create trails-data --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Мережа стежок областей" \
              --notes "Дороги, лісові дороги, стежки, вода й болота областей для маршруту «Додому» без інтернету (формат MRT1, gzip). Генерується workflow «Trails data». Дані: © OpenStreetMap contributors (ODbL)."
          gh release upload trails-data dist/*.bin.gz --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload trails-data dist/*.json --clobber --repo "$GITHUB_REPOSITORY"
