name: Forests data

# Файли лісів областей (рішення PO 2026-11-10: ліси — файлами, не в Postgres).
#  * Вручну: Actions → Forests data → Run workflow → `all` (усі області) або slug однієї
#    (наприклад zhytomyrska) → файли публікуються в реліз «forests-data» (GitHub Releases, CDN).
#  * Щомісяця: перебудова всіх областей (OSM постійно доповнюється). Застосунок
#    перекачує файл лише тоді, коли змінилась його версія.
#  * PR, що змінює генератор: пробна збірка Житомирщини → Artifacts (без публікації).
# Дані: © OpenStreetMap contributors (ODbL), Overpass API. Області збираються паралельно,
# але не більше 2 одночасно — публічні сервери Overpass і так часто перевантажені (502/504).
# Кожна область публікується одразу після збірки — не чекає решту.
on:
  workflow_dispatch:
    inputs:
      region:
        description: '«all» — усі області, або slug однієї (zhytomyrska, kyivska, …)'
        required: true
        default: all
  schedule:
    - cron: '17 1 3 * *' # 3-го числа щомісяця, 01:17 UTC
  pull_request:
    paths:
      - 'scripts/forests/**'
      - '.github/workflows/forests.yml'

permissions:
  contents: read

concurrency:
  group: forests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.event.inputs.region || 'all' }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  test:
    name: Generator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/forests
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config deno.json -A lib.test.ts
      - run: deno check --config deno.json build_region.ts

  # Які області збирати: PR — Житомирщина; вручну — одна або всі; за розкладом — усі.
  plan:
    name: Regions to build
    needs: test
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - name: Supabase public config
        uses: ./.github/actions/supabase-public-config
        with:
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: List regions
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.region }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            REGIONS='["zhytomyrska"]'
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT" ] && [ "$INPUT" != "all" ]; then
            if ! printf '%s' "$INPUT" | grep -Eq '^[a-z0-9-]{2,40}$'; then
              echo "::error::Некоректний slug області: $INPUT"; exit 1
            fi
            REGIONS=$(jq -cn --arg s "$INPUT" '[$s]')
          else
            REGIONS=$(curl -sf -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/functions/v1/regions" \
              | jq -c '[.data[].slug] | sort')
          fi
          COUNT=$(printf '%s' "$REGIONS" | jq 'length')
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then echo "::error::Список областей порожній"; exit 1; fi
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
          echo "### Області для збірки: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$REGIONS" | jq -r '.[]' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  # Реліз створюється один раз заздалегідь — щоб паралельні збірки не створювали його одночасно.
  release:
    name: Ensure release «forests-data»
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh release view forests-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create forests-data --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Дані лісів областей" \
              --notes "Файли лісів областей для застосунку (формат v1-forest-zones, gzip). Генерується workflow «Forests data» (вручну й щомісяця). Дані: © OpenStreetMap contributors (ODbL)."

  build:
    name: Build ${{ matrix.region }}
    needs: [plan, release]
    # PR: release пропускається — збірка все одно має йти.
    if: ${{ always() && needs.plan.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false # одна область не зупиняє решту
      max-parallel: 2
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase public config
        uses: ./.github/actions/supabase-public-config
        with:
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build
        run: deno run --config scripts/forests/deno.json -A scripts/forests/build_region.ts --slug "$REGION" --out dist

      - name: Summary
        run: |
          echo "### Ліси: $REGION" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "dist/forests-$REGION.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: forests-${{ matrix.region }}
          path: dist/
          retention-days: 14

      # Одразу в реліз: спершу дані, потім опис (застосунок читає опис і за ним — дані).
      - name: Publish ${{ matrix.region }}
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload forests-data "dist/forests-$REGION.geojson.gz" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload forests-data "dist/forests-$REGION.json" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Опубліковано: $REGION" >> "$GITHUB_STEP_SUMMARY"

  # Підсумок: що зібралося (області публікуються в build; упала — лишається старий файл).
  summary:
    name: Summary
    if: ${{ always() && github.event_name != 'pull_request' && needs.plan.result == 'success' }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forests-*
          path: dist
          merge-multiple: true
      - name: Check files
        id: files
        run: |
          shopt -s nullglob
          files=(dist/forests-*.geojson.gz)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "### Зібрано й опубліковано областей: ${#files[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Область | Лісів | Розмір | З відомою породою |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for m in dist/forests-*.json; do
            jq -r '"| \(.slug) | \(.features) | \((.bytes/1048576*10|round)/10) МБ | \(.stats.typed // "—") |"' "$m" >> "$GITHUB_STEP_SUMMARY"
          done
