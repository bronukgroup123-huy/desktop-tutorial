name: Forests data

# Файли лісів областей (рішення PO 2026-11-10: ліси — файлами, не в Postgres).
#
# Джерело — вивантаження OpenStreetMap для України з Geofabrik (один файл ~1 ГБ):
# osmium вирізає ліси, build_all.ts за один прохід розкладає їх по всіх областях.
# Без запитів до публічних серверів Overpass (вони часто перевантажені — 502/504,
# і збірка всіх областей через них тривала ~8 год). Тепер — кілька десятків хвилин.
#
#  * Вручну: Actions → Forests data → Run workflow → `all` або slug однієї області
#    → файли публікуються в реліз «forests-data» (GitHub Releases, CDN).
#  * Щомісяця: перебудова всіх областей (OSM постійно доповнюється). Застосунок
#    перекачує файл лише тоді, коли змінилась його версія.
#  * PR, що змінює генератор: пробна збірка всіх областей → Artifacts (без публікації).
# Дані: © OpenStreetMap contributors (ODbL); вивантаження — Geofabrik GmbH.
on:
  workflow_dispatch:
    inputs:
      region:
        description: '«all» — усі області, або slug однієї (zhytomyrska, kyivska, …)'
        required: true
        default: all
  schedule:
    - cron: '17 1 3 * *' # 3-го числа щомісяця, 01:17 UTC
  pull_request:
    paths:
      - 'scripts/forests/**'
      - '.github/workflows/forests.yml'
      - '.github/actions/supabase-public-config/**'

permissions:
  contents: read

concurrency:
  group: forests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'publish' }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  PBF_URL: https://download.geofabrik.de/europe/ukraine-latest.osm.pbf

jobs:
  test:
    name: Generator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/forests
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config deno.json -A lib.test.ts
      - run: deno check --config deno.json build_all.ts build_region.ts

  build:
    name: Build forests (${{ github.event.inputs.region || 'all' }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      REGION: ${{ github.event.inputs.region || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase public config
        uses: ./.github/actions/supabase-public-config
        with:
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Check region input
        run: |
          if [ "$REGION" != "all" ] && ! printf '%s' "$REGION" | grep -Eq '^[a-z0-9-]{2,40}$'; then
            echo "::error::Некоректний slug області: $REGION"; exit 1
          fi

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version | head -1

      # Вивантаження оновлюється щодня; кешуємо на тиждень, щоб повторні запуски не
      # завантажували ~1 ГБ щоразу (ввічливо до Geofabrik).
      - name: Cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: osm/ukraine-latest.osm.pbf
          key: geofabrik-ukraine-${{ steps.week.outputs.week }}

      - name: Download Ukraine extract (Geofabrik)
        run: |
          mkdir -p osm
          if [ ! -s osm/ukraine-latest.osm.pbf ]; then
            curl -fsSL --retry 5 --retry-delay 30 -A "MushroomRadar-forest-builder/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              -o osm/ukraine-latest.osm.pbf "$PBF_URL"
            curl -fsSL --retry 5 -o osm/ukraine-latest.osm.pbf.md5 "$PBF_URL.md5"
            (cd osm && sed 's#  .*#  ukraine-latest.osm.pbf#' ukraine-latest.osm.pbf.md5 | md5sum -c -)
          fi
          ls -lh osm/ukraine-latest.osm.pbf
          osmium fileinfo osm/ukraine-latest.osm.pbf | grep -E 'Bounding|timestamp' || true

      - name: Extract forests (osmium)
        run: |
          osmium tags-filter osm/ukraine-latest.osm.pbf \
            wr/landuse=forest wr/natural=wood wr/landcover=trees \
            -o osm/forests.osm.pbf --overwrite
          osmium export osm/forests.osm.pbf -f geojsonseq --geometry-types=polygon -u type_id \
            -o osm/forests.geojsonseq --overwrite
          ls -lh osm/forests.osm.pbf osm/forests.geojsonseq

      - name: Build region files
        run: |
          ONLY=""
          if [ "$REGION" != "all" ]; then ONLY="--only $REGION"; fi
          deno run --config scripts/forests/deno.json --v8-flags=--max-old-space-size=10240 -A \
            scripts/forests/build_all.ts --input osm/forests.geojsonseq --out dist $ONLY

      - name: Summary
        run: |
          shopt -s nullglob
          metas=(dist/forests-*.json)
          echo "### Ліси областей: ${#metas[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Область | Лісів | Малих (0,1–1 га) | З відомим типом | Розмір |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for m in "${metas[@]}"; do
            jq -r '"| \(.slug) | \(.features) | \(.stats.small) | \(.stats.typed) | \((.bytes/1048576*10|round)/10) МБ |"' "$m" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: forests-${{ env.REGION }}
          path: dist/
          retention-days: 14

      # Спершу дані, потім описи: застосунок читає опис і за ним — дані.
      - name: Publish to release «forests-data»
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view forests-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create forests-data --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Дані лісів областей" \
              --notes "Файли лісів областей для застосунку (формат v1-forest-zones, gzip). Генерується workflow «Forests data» (вручну й щомісяця). Дані: © OpenStreetMap contributors (ODbL)."
          gh release upload forests-data dist/*.geojson.gz --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload forests-data dist/*.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "Опубліковано областей: $(ls dist/*.json | wc -l)" >> "$GITHUB_STEP_SUMMARY"
