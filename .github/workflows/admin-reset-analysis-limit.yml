# Ручне обнулення добового ліміту аналізів ділянки (для тестування застосунку).
# Запуск: Actions → «Admin: reset analysis limit» → Run workflow, вказати назву ділянки
# (як у клітинці «Прогнозу», напр. «Броники») або id користувача.
# Скидає лише сьогоднішній лічильник (київська доба); ділянки й результати не чіпає.
name: "Admin: reset analysis limit"

on:
  workflow_dispatch:
    inputs:
      area_label:
        description: "Назва ділянки (як у застосунку), напр. Броники"
        required: false
        default: ""
      user_id:
        description: "Або id користувача (UUID)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      AREA_LABEL: ${{ inputs.area_label }}
      USER_ID: ${{ inputs.user_id }}
      LC_ALL: C.UTF-8
    steps:
      - name: Reset today's analysis usage
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Немає SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID"; exit 1
          fi
          # Вхідні дані — лише безпечні значення (без лапок і службових символів у SQL).
          if [ -n "$USER_ID" ]; then
            if ! printf '%s' "$USER_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
              echo "::error::user_id — UUID"; exit 1
            fi
            WHERE="u.user_id = '$USER_ID'::uuid"
          elif [ -n "$AREA_LABEL" ]; then
            if ! printf '%s' "$AREA_LABEL" | grep -Pq '^[\p{L}\p{N} ._-]{1,24}$'; then
              echo "::error::Назва ділянки — до 24 літер, цифр, пробілів"; exit 1
            fi
            WHERE="u.user_id IN (SELECT a.user_id FROM public.analysis_areas a WHERE a.label = '$AREA_LABEL')"
          else
            echo "::error::Вкажіть area_label або user_id"; exit 1
          fi
          SQL="DELETE FROM public.analysis_usage u WHERE $WHERE AND u.day = (now() AT TIME ZONE 'Europe/Kyiv')::date RETURNING u.user_id, u.slot, u.count"
          jq -n --arg q "$SQL" '{query: $q}' | curl -sS --fail-with-body \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary @- "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" > result.json
          ROWS=$(jq 'length' result.json)
          echo "Скинуто записів: $ROWS"
          jq -r '.[] | "  слот \(.slot): було \(.count) аналізів"' result.json
          echo "### Ліміт аналізів скинуто: $ROWS запис(ів)" >> "$GITHUB_STEP_SUMMARY"
