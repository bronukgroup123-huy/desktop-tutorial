name: Verify Forecast RPC (temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: find_zone_by_point(50.45, 30.52) — expect 1 row
        run: |
          curl -s -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT stand_age_years, stand_age_source, stand_age_confidence, relief_type, light_type, forest_type FROM public.find_zone_by_point(50.45, 30.52);"}' | jq .
      - name: find_zone_by_point(48.50, 35.00) — expect 0 rows
        run: |
          curl -s -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT count(*) AS row_count FROM (SELECT 1 FROM public.find_zone_by_point(48.50, 35.00)) t;"}' | jq .
