name: Android test APK

# Тестова збірка APK для встановлення на телефон. Вона завжди підписана публічним
# android/app/test-signing.jks і ніколи не є артефактом для Google Play.
#  * push у main      → test APK у Artifacts + оновлений prerelease «android-latest»;
#  * PR / інші гілки  → test APK у Artifacts (перевірка, що збірка не зламалась);
#  * вручну           → Actions → Android test APK → Run workflow.
# Store AAB збирає тільки окремий ручний workflow android-store.yml.
on:
  push:
    branches: ['**']
    paths:
      - 'flutter_client/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'flutter_client/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # maplibre_gl збирається на JDK 21
          # Кеш Gradle (~/.gradle/caches, wrapper): бібліотеки не качаються з Maven Central
          # щоразу — інакше збірки впираються в його ліміт (HTTP 429 Too Many Requests).
          cache: gradle
          cache-dependency-path: |
            flutter_client/android/*.gradle*
            flutter_client/android/app/*.gradle*
            flutter_client/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # Публічні значення (URL проєкту і publishable key) — із секретів репозиторію.
      - name: Build config (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are not set — the APK will show a configuration screen."
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env

      # Firebase (сповіщення «Почалась хвиля») — необов'язково: без секрету push вимкнено.
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase config added"
          else
            echo "::notice::GOOGLE_SERVICES_JSON not set — push notifications disabled in this build"
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Build test APK
        env:
          ORG_GRADLE_PROJECT_requireReleaseSigning: 'false'
        run: |
          build() {
            flutter build apk --release \
              --dart-define-from-file=.env \
              --build-number=${{ github.run_number }}
          }
          # Maven Central інколи тимчасово відмовляє (HTTP 429) — одна повторна спроба за 2 хв.
          if ! build; then
            echo "::warning::Збірка не вдалась (можливо, ліміт Maven Central) — повтор за 2 хв"
            sleep 120
            build
          fi
          mv build/app/outputs/flutter-apk/app-release.apk build/mushroom-radar-test.apk

      - name: Upload test APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mushroom-radar-test-apk
          path: flutter_client/build/mushroom-radar-test.apk
          retention-days: 14

  # Лише для main: постійне посилання на останній APK у розділі Releases.
  publish:
    name: Publish to release «android-latest»
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mushroom-radar-test-apk

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Грибний Радар — остання збірка Android
          prerelease: true
          make_latest: false
          body: |
            Тестова автоматична збірка з `main` (${{ github.sha }}).
            Підписана публічним тестовим ключем і не призначена для Google Play.
            Встановлення: завантажте `mushroom-radar-test.apk` і відкрийте файл на телефоні.
          files: mushroom-radar-test.apk
