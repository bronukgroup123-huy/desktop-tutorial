name: Verify Regions Seed (temporary)

on:
  push:
    paths:
      - '.github/workflows/verify-regions-seed.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Run regions_seed.sql assertions (DO block)
        run: |
          python3 - <<'PY' > /tmp/regions_test.sql
          import re
          raw = open('supabase/tests/regions_seed.sql', encoding='utf-8').read()
          start = raw.index('DO $$')
          print(raw[start:].strip())
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          query = open('/tmp/regions_test.sql', encoding='utf-8').read()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_ID']}/database/query",
              data=json.dumps({"query": query}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              resp = urllib.request.urlopen(req, timeout=120)
              print("DO block PASSED (no exception), HTTP", resp.status)
          except urllib.error.HTTPError as e:
              print("DO block FAILED, HTTP", e.code)
              print(e.read().decode()[:2000])
          PY
      - name: Summary queries
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          q = """
          SELECT
            (SELECT COUNT(*) FROM regions) AS regions_count,
            (SELECT COUNT(*) FROM regions WHERE slug IS NULL) AS slug_null,
            (SELECT COUNT(*) FROM regions WHERE katottg IS NULL OR katottg !~ '^UA[0-9]{17}$') AS bad_katottg,
            point_in_region(50.45, 30.52, (SELECT id FROM regions WHERE slug='kyiv')) AS in_kyiv,
            point_in_region(50.45, 30.52, (SELECT id FROM regions WHERE slug='lvivska')) AS in_lviv,
            (SELECT COUNT(*) FROM forest_zones WHERE region_id IS NULL) AS orphan_zones,
            (SELECT region_id FROM forest_zones LIMIT 1) AS fz_region_id;
          """
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_ID']}/database/query",
              data=json.dumps({"query": q}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          resp = urllib.request.urlopen(req, timeout=120)
          print(json.dumps(json.load(resp), indent=2, ensure_ascii=False))
          PY
      - name: Geometry types
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          q = "SELECT DISTINCT ST_GeometryType(polygon) AS gtype FROM regions;"
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_ID']}/database/query",
              data=json.dumps({"query": q}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          resp = urllib.request.urlopen(req, timeout=120)
          print(json.dumps(json.load(resp), indent=2))
          PY
