name: Probe forest data sources

# Тимчасова перевірка джерел даних про породи лісу (запускається пушем у цю гілку).
# Лише читає публічні адреси; нічого не публікує. Видаляється після перевірки.
on:
  push:
    branches: [claude/project-rb2fo8]
    paths: ['.github/workflows/probe-forest-sources.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lisproekt ArcGIS — folders, services, layers
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request
          BASE = "https://gis.lisproekt.gov.ua/server/rest/services"
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "MushroomRadar-source-check/1.0"}), timeout=40) as r:
                      return json.loads(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  return {"_error": str(e)}
          root = get(BASE + "?f=json")
          for folder in root.get("folders", []):
              d = get(f"{BASE}/{folder}?f=json")
              print(f"\n=== folder {folder}: {d.get('_error') or d.get('error') or ''}")
              for s in d.get("services", []):
                  name, typ = s["name"], s["type"]
                  url = f"{BASE}/{name}/{typ}"
                  info = get(url + "?f=json")
                  print(f"  - {name} [{typ}] {info.get('_error') or info.get('error') or ''}")
                  if "serviceDescription" in info: print("      desc:", (info.get("serviceDescription") or info.get("description") or "")[:300].replace("\n", " "))
                  for k in ("capabilities", "supportedExtensions", "pixelType", "bandCount", "pixelSizeX"):
                      if k in info: print(f"      {k}: {info[k]}")
                  if "extent" in info or "fullExtent" in info: print("      extent:", info.get("fullExtent") or info.get("extent"))
                  for l in (info.get("layers") or [])[:40]:
                      li = get(f"{url}/{l['id']}?f=json")
                      fields = [f["name"] for f in (li.get("fields") or [])][:40]
                      print(f"      layer {l['id']}: {l.get('name')} | geom={li.get('geometryType')} | {li.get('_error') or li.get('error') or ''}")
                      if fields: print("        fields:", fields)
                      r = (li.get("drawingInfo") or {}).get("renderer") or {}
                      vals = [ (u.get("value"), u.get("label")) for u in (r.get("uniqueValueInfos") or [])][:40]
                      if vals: print("        classes:", vals)
                  if typ == "ImageServer":
                      ki = get(url + "/keyProperties?f=json")
                      print("      keyProperties:", str(ki)[:500])
                      rat = get(url + "/rasterAttributeTable?f=json")
                      print("      RAT:", str(rat)[:1500])
          PY

      - name: NFI site — links to maps/data
        shell: bash
        run: |
          set +e
          for u in https://nfi.lisproekt.gov.ua/ https://www.lisproekt.gov.ua/diyalnist/natsionalna-inventaryzatsiya-lisiv; do
            echo "=== $u"
            curl -sSL -m 40 -A "MushroomRadar-source-check/1.0" "$u" | grep -oE 'href="[^"]+"' | sort -u | grep -viE 'wp-|\.css|\.js|feed|xmlrpc|#|facebook|youtube|instagram|t\.me' | head -80
          done

      - name: ForestPaths — is Ukraine covered?
        shell: bash
        run: |
          set +e
          pip install -q pyproj >/dev/null 2>&1
          curl -sSL -m 120 -o grid.gpkg "https://zenodo.org/records/13341104/files/grid.gpkg?download=1"
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect("grid.gpkg")
          tabs = [r[0] for r in con.execute("select table_name from gpkg_contents")]
          print("tables:", tabs)
          for t in tabs:
              cols = [r[1] for r in con.execute(f'pragma table_info("{t}")')]
              print(t, "columns:", cols)
              rows = con.execute(f'select * from "{t}" limit 3').fetchall()
              for r in rows: print("  sample:", [x if not isinstance(x, bytes) else f"<{len(x)} bytes>" for x in r])
              print("  rows:", con.execute(f'select count(*) from "{t}"').fetchone()[0])
          PY
          curl -sSL -m 600 -o col5600.zip "https://zenodo.org/records/13341104/files/ulx_5600.zip?download=1" && unzip -l col5600.zip | tail -40
          curl -sSL -m 600 -o col5500.zip "https://zenodo.org/records/13341104/files/ulx_5500.zip?download=1" && unzip -l col5500.zip | tail -40
          python3 -c "
          from pyproj import Transformer
          t = Transformer.from_crs('EPSG:4326', 'EPSG:3035', always_xy=True)
          for n, lon, lat in [('Zhytomyr',28.66,50.25),('Ovruch',28.80,51.32),('Novohrad',27.62,50.59),('Berdychiv',28.58,49.90),('Lviv',24.03,49.84),('Kovel',24.71,51.21)]:
              x,y = t.transform(lon,lat); print(n, int(x), int(y), 'tile ulx', int(x//100000*100), 'uly', int((y//100000+1)*100))
          "
