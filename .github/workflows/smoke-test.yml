name: Production Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch API keys from Management API
        id: keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          RESULT=$(curl -sS --fail-with-body -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/api-keys?reveal=true")
          ANON_KEY=$(echo "$RESULT" | jq -er '.[] | select(.name=="anon") | .api_key')
          SERVICE_KEY=$(echo "$RESULT" | jq -er '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "service_key=$SERVICE_KEY" >> "$GITHUB_OUTPUT"

      - name: Ensure test user exists
        env:
          SERVICE_KEY: ${{ steps.keys.outputs.service_key }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          TEST_EMAIL: smoke-test@mushroomradar.dev
          TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -e
          RESPONSE=$(curl -s -X POST \
            "https://$PROJECT_ID.supabase.co/auth/v1/admin/users" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\",\"email_confirm\":true}")
          USER_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$USER_ID" ]; then
            echo "User probably exists, fetching via admin list"
            USER_ID=$(curl -s -H "Authorization: Bearer $SERVICE_KEY" \
              -H "apikey: $SERVICE_KEY" \
              "https://$PROJECT_ID.supabase.co/auth/v1/admin/users" \
              | jq -r ".users[] | select(.email==\"$TEST_EMAIL\") | .id")
          fi
          # Пароль тестового користувача тепер у секреті (раніше був у репозиторії) —
          # синхронізуємо його для вже існуючого користувача.
          curl -s -X PUT "https://$PROJECT_ID.supabase.co/auth/v1/admin/users/$USER_ID" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"$TEST_PASSWORD\"}" > /dev/null
          echo "USER_ID=$USER_ID" >> $GITHUB_ENV
          echo "User: $USER_ID"

      - name: Sign in and get JWT
        id: jwt
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          TEST_EMAIL: smoke-test@mushroomradar.dev
          TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          JWT=$(curl -s -X POST \
            "https://$PROJECT_ID.supabase.co/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}" \
            | jq -r '.access_token')
          if [ "$JWT" = "null" ] || [ -z "$JWT" ]; then
            echo "Login failed"
            exit 1
          fi
          echo "::add-mask::$JWT"
          echo "jwt=$JWT" >> $GITHUB_OUTPUT
          echo "JWT length: ${#JWT}"

      # Після деплою: живі v1-ендпоінти відповідають, внутрішні — лише service_role,
      # застарілі Guardian v0 (ADR-022, SEC-005) видалені.
      - name: v1-me and v1-guardian answer for a signed-in user
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          JWT: ${{ steps.jwt.outputs.jwt }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for fn in v1-me v1-guardian; do
            CODE=$(curl -s -o /tmp/$fn.json -w '%{http_code}' \
              "https://$PROJECT_ID.supabase.co/functions/v1/$fn" \
              -H "Authorization: Bearer $JWT" -H "apikey: $ANON_KEY")
            echo "$fn → $CODE"
            if [ "$CODE" != "200" ] || ! jq -e '.data' /tmp/$fn.json >/dev/null; then
              echo "Expected 200 with .data from $fn"; exit 1
            fi
          done

      - name: Gateway auth matrix rejects invalid callers and keeps public safety available
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # Explicit public allowlist: no Authorization bearer is required.
          CODE=$(curl -s -o /tmp/v1-app-config.json -w '%{http_code}' \
            "https://$PROJECT_ID.supabase.co/functions/v1/v1-app-config" \
            -H "apikey: $ANON_KEY")
          echo "v1-app-config (public, no bearer) → $CODE"
          if [ "$CODE" != "200" ] || ! jq -e '.data.safety' /tmp/v1-app-config.json >/dev/null; then
            echo "Expected public safety config without an Authorization bearer"; exit 1
          fi

          # Protected user endpoint: missing, malformed and project anon-role JWTs are not user sessions.
          for AUTH in "" "Bearer not-a-jwt" "Bearer $ANON_KEY"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://$PROJECT_ID.supabase.co/functions/v1/v1-me" \
              ${AUTH:+-H "Authorization: $AUTH"} -H "apikey: $ANON_KEY")
            echo "v1-me (${AUTH:+with invalid/non-user token}${AUTH:-no token}) → $CODE"
            if [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
              echo "Expected 401/403 from protected user endpoint"; exit 1
            fi
          done

          # Webhook bypasses gateway JWT only because its own secret is mandatory.
          for SECRET in "" "wrong-secret"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "https://$PROJECT_ID.supabase.co/functions/v1/v1-telegram-webhook" \
              -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
              ${SECRET:+-H "X-Telegram-Bot-Api-Secret-Token: $SECRET"} -d '{}')
            echo "v1-telegram-webhook (${SECRET:+wrong secret}${SECRET:-no secret}) → $CODE"
            if [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
              echo "Expected 401/403 from webhook without the configured secret"; exit 1
            fi
          done

      - name: Internal job rejects callers without the service key
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          JWT: ${{ steps.jwt.outputs.jwt }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for AUTH in "" "Bearer $ANON_KEY" "Bearer $JWT"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "https://$PROJECT_ID.supabase.co/functions/v1/v1-guardian-tick" \
              ${AUTH:+-H "Authorization: $AUTH"} -H "apikey: $ANON_KEY")
            echo "v1-guardian-tick (${AUTH:+with token}${AUTH:-no token}) → $CODE"
            if [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
              echo "Expected 401/403"; exit 1
            fi
          done

      - name: Retired legacy functions are gone
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for fn in guardian-session-create guardian-demo-create guardian-tick forecast-weather forecast; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "https://$PROJECT_ID.supabase.co/functions/v1/$fn" -H "apikey: $ANON_KEY")
            echo "$fn → $CODE"
            if [ "$CODE" != "404" ]; then
              echo "Expected 404 (function deleted by deploy.yml)"; exit 1
            fi
          done
