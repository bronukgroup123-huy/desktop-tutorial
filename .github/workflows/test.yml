name: Tests

# Запускається на кожен push і PR, а також викликається з deploy.yml (workflow_call),
# щоб деплой ішов лише після зелених тестів (BACKEND_PLAN B0.1).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # Кореневий package.json вмикає для Deno режим node_modules — для Edge Functions він не потрібен.
  DENO_FLAGS: --node-modules-dir=none

jobs:
  unit:
    name: Unit tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Edge Function authentication matrix
        run: |
          node --test scripts/ci/check-edge-auth-matrix.test.mjs
          node scripts/ci/check-edge-auth-matrix.mjs

      - name: Android signing separation
        run: |
          node --test scripts/ci/check-android-signing.test.mjs
          node scripts/ci/check-android-signing.mjs

      - name: Flutter/OpenAPI model contract
        run: |
          node --test scripts/ci/check-flutter-openapi-models.test.mjs
          node scripts/ci/check-flutter-openapi-models.mjs

      - name: Workflow token permissions
        run: |
          node --test scripts/ci/check-workflow-permissions.test.mjs
          node scripts/ci/check-workflow-permissions.mjs
          node --test scripts/ci/run-wave-alerts.test.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Блокує: строга перевірка типів для нового коду (v1-* та спільний HTTP-шар).
      - name: Type check (strict, new code)
        run: |
          deno check $DENO_FLAGS \
            supabase/functions/_shared/http.ts \
            supabase/functions/v1-*/index.ts \
            supabase/functions/me/index.ts

      # Блокує: юніт-тести (без живого Supabase).
      - name: Unit tests
        run: deno test $DENO_FLAGS --no-check --allow-net --allow-read --allow-env supabase/tests/ supabase/functions/_shared/

      # Блокує (QA-002): строга перевірка типів УСІХ функцій, що деплояться, тестів і спільного коду.
      # Застарілий код із помилками типів прибрано (SEC-005).
      - name: Type check (all deployed functions, tests, shared)
        run: deno check $DENO_FLAGS supabase/functions/*/index.ts supabase/tests/ supabase/functions/_shared/

  flutter:
    name: Flutter client (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

  migrations:
    name: Migrations apply on a fresh database
    runs-on: ubuntu-latest
    # Блокує: усі міграції мають застосовуватись на чистій БД, а RLS SQL-тести — проходити.
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.1.4

      - name: Start local Postgres and apply all migrations
        run: supabase db start

      - name: SQL tests (RLS, security)
        run: |
          for f in supabase/tests/*.sql; do
            echo "▶ $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
