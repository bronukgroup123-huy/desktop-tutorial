name: Codex autonomous maintenance

on:
  workflow_dispatch:
  schedule:
    # Maximum gap is five hours; the final daily interval (20:17 → 00:17) is four.
    - cron: '17 0,5,10,15,20 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-autonomous-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check autonomous maintenance window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today=$(date -u +%F)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$today" < "2026-12-23" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Autonomous maintenance window ended on 2026-12-22; scheduled run skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Check required configuration
        if: steps.window.outputs.active == 'true'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required after budget approval"
            exit 1
          fi

      - name: Create isolated branch
        if: steps.window.outputs.active == 'true'
        run: |
          branch="codex/auto-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name "mushroom-radar-codex"
          git config user.email "actions@users.noreply.github.com"
          echo "AUTONOMY_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Install pinned Codex CLI
        if: steps.window.outputs.active == 'true'
        run: npm install --global @openai/codex@0.171.0

      - name: Execute one bounded task
        if: steps.window.outputs.active == 'true'
        run: |
          codex exec \
            --approve-for-me \
            --sandbox workspace-write \
            --ephemeral \
            -C "$GITHUB_WORKSPACE" \
            - < .github/codex/autonomy.md

      - name: Commit verified work
        if: steps.window.outputs.active == 'true'
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add --all
            git commit -m "chore(agent): autonomous maintenance run $GITHUB_RUN_ID"
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No commit produced"
            exit 0
          fi
          git push --set-upstream origin "$AUTONOMY_BRANCH"

      - name: Open review-only pull request
        if: steps.window.outputs.active == 'true'
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$AUTONOMY_BRANCH" \
            --title "Codex maintenance run $GITHUB_RUN_ID" \
            --body "Automated bounded maintenance run. Review all changes and CI results. Auto-merge is disabled."
