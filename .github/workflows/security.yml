name: Security

# Етап 1 Security Roadmap: пошук секретів у коді та історії (Gitleaks).
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # щопонеділка — повний скан історії
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --verbose
