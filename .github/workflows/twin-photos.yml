# Фото двійників без ліцензійних обмежень (CC0 / суспільне надбання) з Wikimedia Commons та
# iNaturalist → папка «фото двійників (webp)», ліцензії, довідник застосунку → коміт у ту ж гілку.
# Мережа до Commons / iNaturalist є лише тут (не в середовищі розробки).
name: Twin photos

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/catalog_sync/fetch_free_photos.py'
      - '.github/workflows/twin-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch free photos
        run: |
          pip install pillow
          python3 scripts/catalog_sync/fetch_free_photos.py
          python3 scripts/build_licenses.py
          python3 scripts/catalog_sync/build_app_catalog.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "фото двійників (webp)" mushroom_catalog.json data/catalog/mushroom_catalog.js \
            flutter_client/assets/catalog/catalog.json.gz
          if git diff --cached --quiet; then echo "Нічого нового"; exit 0; fi
          git commit -m "Фото двійників без ліцензійних обмежень (CC0 / суспільне надбання)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
