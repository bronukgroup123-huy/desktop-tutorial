# Щоденні сповіщення «Почалась хвиля» (ADR-015 §15.8 п.19): викликає Edge Function
# v1-wave-alerts з ключем service_role. Розклад — ~07:15 за Києвом (взимку UTC+2).
# Без FIREBASE_ENABLED=true / FIREBASE_SERVICE_ACCOUNT_JSON функція аналізує, але push не надсилає.
name: "Wave alerts"

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Send wave alerts
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::Немає SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID — пропуск"; exit 0
          fi
          KEY=$(curl -sS --fail -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/api-keys?reveal=true" \
            | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$KEY"
          RES=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            --max-time 280 "https://$PROJECT_ID.supabase.co/functions/v1/v1-wave-alerts" -d '{}')
          echo "$RES" | jq '.data'
          echo "### Сповіщення про хвилі: $(echo "$RES" | jq -c '.data')" >> "$GITHUB_STEP_SUMMARY"
