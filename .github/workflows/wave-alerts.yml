# Щоденні сповіщення «Почалась хвиля» (ADR-015 §15.8 п.19): викликає Edge Function
# v1-wave-alerts з ключем service_role. Розклад — ~07:15 за Києвом (взимку UTC+2).
# Без FIREBASE_ENABLED=true / FIREBASE_SERVICE_ACCOUNT_JSON функція аналізує, але push не надсилає.
name: "Wave alerts"

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send wave alerts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/ci/run-wave-alerts.mjs
