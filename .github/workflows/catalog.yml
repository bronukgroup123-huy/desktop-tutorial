# Довідник для застосунку: фото (WebP до 1080 px + мініатюри, в архівах tar) → реліз «catalog-photos».
# Тексти довідника вбудовані в застосунок (flutter_client/assets/catalog/catalog.json.gz,
# генерує той самий скрипт); застосунок завантажує фото з релізу і зберігає на телефоні.
name: Catalog photos

on:
  push:
    branches: [main]
    paths:
      - 'web-guardian/public/mushroom_catalog.js'
      - 'web-guardian/public/mushroom_descriptions.js'
      - 'scripts/catalog_sync/build_app_catalog.py'
      - 'фото Топ-20 грибів (webp)/**'
      - 'фото популярні 55 грибів (webp)/**'
      - 'Отруйні та смертельно отруйні (webp)/**'
      - 'Червона книга (webp)/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalog and photos
        run: |
          pip install pillow
          python3 scripts/catalog_sync/build_app_catalog.py --photos dist/catalog
          if ! git diff --quiet -- flutter_client/assets/catalog/catalog.json.gz; then
            echo "::warning::catalog.json.gz у репозиторії застарів — запустіть scripts/catalog_sync/build_app_catalog.py і закомітьте"
          fi
      - name: Publish to release «catalog-photos»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          # Окремий реліз «catalog-photos» (лише архіви). Старий «catalog-data» з окремими фото
          # першої спроби не чіпаємо: видалення релізу з сотнями файлів GitHub обриває (HTTP 502).
          create() {
            gh release create catalog-photos --repo "$R" --prerelease --latest=false \
              --title "Довідник: фото для застосунку" \
              --notes "Фото довідника (WebP в архівах tar: <id>.tar, thumbs.tar). Генерує .github/workflows/catalog.yml."
          }
          gh release view catalog-photos --repo "$R" >/dev/null 2>&1 || create
          gh release view catalog-photos --repo "$R" --json assets -q '.assets[] | "\(.name) \(.size)"' > existing.txt
          # По одному архіву з паузою; незмінені (той самий розмір) — пропускаємо;
          # на ліміт GitHub — чекаємо й повторюємо.
          uploaded=0 skipped=0
          for f in dist/catalog/*.tar dist/catalog/manifest.json; do
            name=$(basename "$f")
            size=$(stat -c %s "$f")
            if grep -qx "$name $size" existing.txt; then skipped=$((skipped+1)); continue; fi
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload catalog-photos "$f" --clobber --repo "$R"; then ok=1; break; fi
              echo "::warning::$name: спроба $attempt не вдалась, чекаю $((attempt*60)) с"
              sleep $((attempt*60))
            done
            [ "$ok" = 1 ] || { echo "::error::Не вдалося викласти $name"; exit 1; }
            uploaded=$((uploaded+1))
            sleep 3
          done
          echo "### Фото довідника: викладено $uploaded архівів, без змін $skipped" >> "$GITHUB_STEP_SUMMARY"
