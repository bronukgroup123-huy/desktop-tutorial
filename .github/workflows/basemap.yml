name: Basemap (offline region map)

# Офлайн карта області (ADR-020): векторна карта-підкладка, яку застосунок качає один раз і
# далі малює з телефону — без серверів плиток і без інтернету. Серверних плиток у застосунку
# немає: поки офлайн карту не завантажено, карта не показується.
#
# Дані — те саме вивантаження OpenStreetMap для України з Geofabrik, що й для лісів;
# Planetiler (схема OpenMapTiles) будує підкладку області, z0–14 (далі застосунок наближає
# без нових даних). У той самий файл додається шар `forests` — ліси області з типами й
# кольорами (файл «Forests data», нарізаний tippecanoe): так ліси малюються плитками разом
# із картою (під дорогами й підписами, з кешем), а не тисячами контурів щокадру. Без будівель, номерів будинків, POI й аеропортів — грибнику
# вони не потрібні, а файл і малювання стають легшими. Назви — з `name:uk` (у прикордонних
# річок `name` двомовне: «Дністер / Nistru»).
#
#  * Вручну: Actions → Basemap → `all` або slug області → publish = true → реліз «basemap-data».
#  * Щомісяця — після перебудови лісів (Forests data — 3-го числа о 01:17 UTC).
# Дані: © OpenStreetMap contributors (ODbL); вивантаження — Geofabrik GmbH;
# дрібний масштаб — Natural Earth (public domain); вода — osmdata.openstreetmap.de (ODbL).
on:
  workflow_dispatch:
    inputs:
      region:
        description: '«all» — усі області, або slug однієї (lvivska, kyivska, …)'
        required: true
        default: all
      publish:
        description: 'Опублікувати в реліз «basemap-data»'
        type: boolean
        default: false
  schedule:
    - cron: '47 4 3 * *' # 3-го числа щомісяця, після «Forests data»

permissions:
  contents: read

concurrency:
  group: basemap-${{ github.event.inputs.region || 'all' }}
  cancel-in-progress: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  PBF_URL: https://download.geofabrik.de/europe/ukraine-latest.osm.pbf

jobs:
  regions:
    name: Regions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Supabase public config
        uses: ./.github/actions/supabase-public-config
        with:
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: List regions
        id: list
        env:
          IN_REGION: ${{ github.event.inputs.region || 'all' }}
        run: |
          set -euo pipefail
          printf '%s' "$IN_REGION" | grep -Eq '^[a-z0-9-]{2,40}$' || { echo "::error::Некоректний slug: $IN_REGION"; exit 1; }
          if [ "$IN_REGION" = "all" ]; then
            curl -fsS --retry 4 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/functions/v1/regions" \
              | jq -c '[.data[].slug] | sort' > matrix.json
          else
            jq -cn --arg s "$IN_REGION" '[$s]' > matrix.json
          fi
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Basemap ${{ matrix.region }}
    needs: regions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJson(needs.regions.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - name: Check input
        run: |
          printf '%s' "$REGION" | grep -Eq '^[a-z0-9-]{2,40}$' || { echo "::error::Некоректний slug: $REGION"; exit 1; }
      - name: Supabase public config
        uses: ./.github/actions/supabase-public-config
        with:
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool tippecanoe
          tippecanoe --version 2>&1 | head -1

      - name: Cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: osm/ukraine-latest.osm.pbf
          key: geofabrik-ukraine-${{ steps.week.outputs.week }}
      # Natural Earth і полігони води Planetiler качає сам (--download); зберігаємо між запусками.
      - uses: actions/cache@v4
        with:
          path: data/sources
          key: planetiler-sources-${{ steps.week.outputs.week }}
          restore-keys: planetiler-sources-

      - name: Region boundary → OSM extract
        run: |
          set -euo pipefail
          mkdir -p osm dist
          if [ ! -s osm/ukraine-latest.osm.pbf ]; then
            curl -fsSL --retry 5 --retry-delay 30 -A "MushroomRadar-basemap/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              -o osm/ukraine-latest.osm.pbf "$PBF_URL"
          fi
          curl -fsS --retry 4 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/functions/v1/v1-regions/$REGION/geometry?detail=high" \
            | jq '{type: "Feature", properties: {}, geometry: .data.geometry}' > osm/region.geojson
          osmium extract -p osm/region.geojson --strategy smart -o osm/region.osm.pbf --overwrite osm/ukraine-latest.osm.pbf
          ls -lh osm/region.osm.pbf

      - name: Planetiler (OpenMapTiles) → MBTiles
        run: |
          set -euo pipefail
          curl -fsSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          START=$(date +%s)
          java -Xmx10g -jar planetiler.jar \
            --osm-path=osm/region.osm.pbf \
            --output=osm/base.mbtiles \
            --download --download-threads=4 \
            --maxzoom=14 --force \
            --languages=uk \
            --exclude-layers=building,housenumber,poi,aerodrome_label,aeroway,mountain_peak
          echo "BUILD_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          ls -lh osm/base.mbtiles

      # Ліси області (типи й кольори — з файлу «Forests data») → шар `forests` тієї ж карти.
      - name: Forests layer (tippecanoe) + join → PMTiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download forests-data --repo "$GITHUB_REPOSITORY" -p "forests-$REGION.geojson.gz" -D osm --clobber
          gunzip -f "osm/forests-$REGION.geojson.gz"
          # z6–14; на дрібних масштабах — без найменших гаїв (на екрані вони менші за піксель).
          tippecanoe -o osm/forests.mbtiles -l forests -Z6 -z14 \
            -y type_color -y forest_type \
            --drop-smallest-as-needed --extend-zooms-if-still-dropping \
            --no-tile-size-limit --force "osm/forests-$REGION.geojson"
          tile-join -o "dist/basemap-$REGION.pmtiles" --no-tile-size-limit --force osm/base.mbtiles osm/forests.mbtiles
          ls -lh osm/*.mbtiles dist/

      - name: Meta
        run: |
          set -euo pipefail
          F="dist/basemap-$REGION.pmtiles"
          jq -n --arg slug "$REGION" --arg version "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson bytes "$(stat -c %s "$F")" --arg sha256 "$(sha256sum "$F" | cut -d' ' -f1)" \
            --arg file "basemap-$REGION.pmtiles" \
            '{slug: $slug, version: $version, bytes: $bytes, sha256: $sha256, data_file: $file,
              format: "pmtiles", schema: "openmaptiles", maxzoom: 14,
              source: "© OpenStreetMap contributors (ODbL); OpenMapTiles; Natural Earth"}' > "dist/basemap-$REGION.json"
          cat "dist/basemap-$REGION.json"
          echo "| $REGION | $(( $(stat -c %s "$F") / 1048576 )) МБ | ${BUILD_SECONDS} с |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: basemap-${{ env.REGION }}
          path: dist/
          retention-days: 7

      - name: Publish to release «basemap-data»
        if: github.event.inputs.publish == 'true' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view basemap-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create basemap-data --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Офлайн карти областей" \
              --notes "Векторні карти-підкладки областей (PMTiles, схема OpenMapTiles). Генерує workflow «Basemap». Дані: © OpenStreetMap contributors (ODbL); OpenMapTiles; Natural Earth."
          # Спершу файл, потім опис: застосунок читає опис і за ним — файл.
          gh release upload basemap-data "dist/basemap-$REGION.pmtiles" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload basemap-data "dist/basemap-$REGION.json" --clobber --repo "$GITHUB_REPOSITORY"
