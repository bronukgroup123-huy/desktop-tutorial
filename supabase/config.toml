project_id = "wrukmuxdbkbmkygfasai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Вебсайту немає (WEB-001): після входу — назад у застосунок (deep link)
site_url = "ua.mushroomradar.app://login-callback/"
additional_redirect_urls = ["ua.mushroomradar.app://login-callback/"]
jwt_expiry = 3600
enable_signup = true
# ADR-001: гостьовий режим через Anonymous Sign-In (на продакшні увімкнено в Dashboard)
enable_anonymous_sign_ins = true
# Гість → Google зі збереженням id (linkIdentity). На продакшні: Dashboard → Authentication →
# Sign In / Providers → Allow manual linking (деплой цей перемикач не змінює).
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false

# SEC-004: platform JWT verification is enabled by default. Only functions that
# are intentionally public, mix public reads with handler-level auth, or verify
# a third-party webhook secret may bypass the gateway JWT check.
[functions.catalog]
verify_jwt = false

[functions.picks]
verify_jwt = false

[functions.regions]
verify_jwt = false

[functions.v1-air-alerts]
verify_jwt = false

[functions.v1-app-config]
verify_jwt = false

[functions.v1-regions]
verify_jwt = false

[functions.v1-telegram-webhook]
verify_jwt = false
