openapi: 3.1.0
info:
  title: Грибний Радар — клієнтський API v1
  version: 1.0.0
  description: |
    Ендпоінти `v1-*` для Flutter-клієнта (BACKEND_PLAN: робочий блок 1, Тук-тук B3.0–B3.3,
    аналіз ділянки B2.9).

    * Базовий URL: `https://<PROJECT_REF>.supabase.co/functions/v1`
    * Кожен запит: заголовок `apikey: <SUPABASE_ANON_KEY>`.
    * Гість (ADR-001) входить через Anonymous Sign-In і має звичайний JWT.
    * Успіх: `{ "data": ... }`. Помилка: `{ "error": "snake_case", "message"?: "текст UA" }`.
    * Числових ймовірностей у відповідях немає (маніфест, Заборона №1).
servers:
  - url: https://{projectRef}.supabase.co/functions/v1
    variables:
      projectRef:
        default: PROJECT_REF

security:
  - apikey: []
    bearerAuth: []

paths:
  /v1-me:
    get:
      operationId: getMe
      summary: Профіль, стан онбордингу і право змінити область
      responses:
        '200':
          description: Профіль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      summary: Онбординг і профіль (ім'я, Home Region, згода з умовами)
      description: |
        * Перший вибір області — вільний.
        * Повторна зміна (ADR-016): одне безкоштовне виправлення протягом 24 год після першого
          вибору; далі — тільки Pro (один раз) або підтримка → `403 region_change_not_allowed`.
        * `accept_terms_version` має дорівнювати `onboarding.terms_version` з `GET /v1-me`,
          інакше `409 terms_version_outdated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Оновлений профіль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-regions/{slug}/geometry:
    get:
      operationId: getRegionGeometry
      summary: Кордон області для маски «острова»
      security:
        - apikey: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,31}$' }
        - name: detail
          in: query
          schema: { type: string, enum: [low, medium, high], default: medium }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Кордон області (кешується 24 год, ETag)
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RegionGeometry' }
        '304': { description: Не змінилось }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-forest-zones:
    get:
      operationId: getForestZones
      summary: Полігони лісів — тільки в межах Home Region користувача
      parameters:
        - name: bbox
          in: query
          description: 'minLng,minLat,maxLng,maxLat — видима частина карти; без bbox — уся область'
          schema: { type: string, example: '30.2,50.2,30.9,50.7' }
        - name: z
          in: query
          description: Масштаб карти (0..22) — для спрощення геометрії
          schema: { type: integer, minimum: 0, maximum: 22 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 5000 }
      responses:
        '200':
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ForestFeatureCollection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-forecast:
    post:
      operationId: getForecast
      summary: Прогноз для точки в межах Home Region
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForecastRequest' }
      responses:
        '200':
          description: Прогноз
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Forecast' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks/upload-url:
    post:
      operationId: createPickUploadUrl
      summary: Тук-тук, крок 1 — посилання для завантаження фото
      description: |
        Фото ніколи не передається як base64 (ADR-002). Потік:

        1. `POST /v1-picks/upload-url` → `upload_url`, `path`.
        2. `PUT <upload_url>` — тіло запиту це файл, заголовок `Content-Type` — тип фото.
           Без заголовків `Authorization` / `apikey`: посилання вже містить дозвіл.
        3. `POST /v1-picks` з тим самим `client_id` і отриманим `path`.

        Повторний виклик з тим самим `client_id` повертає нове посилання на **той самий**
        шлях — так офлайн-черга безпечно повторює крок. Посилання діє до `expires_at`.
        Доступно гостю (ADR-001). Потрібен обраний Home Region.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickUploadUrlRequest' }
      responses:
        '200':
          description: Посилання для завантаження
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PickUploadUrl' }
        '400':
          description: '`photo_too_large` (понад 5 МіБ), `invalid_photo_format` (не JPEG / PNG / WebP), `invalid_json`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422':
          description: '`validation_error` — некоректні `client_id` або `size_bytes`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks:
    post:
      operationId: createPick
      summary: Тук-тук, крок 3 — створити точку
      description: |
        Створює точку з фото, яке вже завантажено за `upload_url` (ADR-002, ADR-018).

        * Видимість — лише `private` або `public`. Гість створює тільки `private`
          (`403 registration_required`).
        * Точка має бути в Home Region користувача (`403 outside_home_region`).
        * `species_id: null` — «Не знаю, що це»; така точка може бути лише приватною
          (`422 species_required`).
        * Ліміти (до появи Pro і рівнів): 5 приватних на добу; публічні — з рівня
          «Лісовик» (`403 level_required`), 5 на добу. Перевищення — `429 daily_limit_reached`.
          Текст для користувача — у `message`.
        * `ai_check` — підказка локального ШІ з телефону, а не доказ: рівні словами, без
          відсотків. Сервер ШІ не запускає (ADR-006).
        * Статус нової публічної точки завжди «Перевіряється»: підтверджують люди.
        * Сервер вирізає з фото EXIF та інші метадані. Іншим користувачам публічна точка
          показується зі стабільним зсувом 300–500 м; точні координати бачить лише автор.
        * Ідемпотентність: повтор з тим самим `client_id` → `200` з тією самою точкою.
        * У `description` телефони, e-mail, посилання і @нікнейми замінюються на «…».
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickRequest' }
      responses:
        '201':
          description: Точку створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickCreatedResponse' }
        '200':
          description: Повтор запиту (той самий `client_id`) — точка вже існує, дубля немає
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickCreatedResponse' }
        '400':
          description: '`photo_too_large`, `invalid_photo_format` (завантажений файл не є JPEG / PNG / WebP), `invalid_json`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`registration_required` (гість + public), `forbidden` (чужий `path`), `outside_home_region`, `level_required`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422':
          description: '`validation_error`, `species_required`, `unknown_species`, `photo_not_uploaded`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`daily_limit_reached` (добовий ліміт точок) або `rate_limited` (+ `Retry-After`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1-picks/map:
    get:
      operationId: getPicksMap
      summary: Тук-туки на карті Home Region
      description: |
        Публічні точки інших людей у своїй області (сірі — «Перевіряється», зелені —
        «Підтверджено»; відхилені не показуються) і власні точки. `mine=true` додає власні
        приватні (перемикач «Приватні точки», ADR-018 §18.2).

        **Приватність (ADR-018 §18.5).** Для чужих точок `lat` / `lng` — зсунуте місце
        (300–500 м від справжнього, зсув стабільний), `is_exact: false`. Точні координати —
        лише автору. Фільтр `bbox` для чужих точок теж працює за зсунутим місцем.
      parameters:
        - name: bbox
          in: query
          description: 'minLng,minLat,maxLng,maxLat — видима частина карти; без bbox — уся область'
          schema: { type: string, example: '30.2,50.2,30.9,50.7' }
        - name: mine
          in: query
          description: Показати й власні приватні точки
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Точки (не більше 500; якщо їх більше — `truncated`)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [points, truncated]
                    properties:
                      points:
                        type: array
                        items: { $ref: '#/components/schemas/MapPick' }
                      truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks/species:
    get:
      operationId: getPickSpecies
      summary: Список видів для вибору назви тук-тука
      description: |
        Назва точки — тільки зі списку довідника (ADR-018 §18.3). `unknown_label` — варіант
        «Не знаю, що це» (`species_id: null`; така точка може бути лише приватною).
        Відповідь можна кешувати на годину.
      responses:
        '200':
          description: Види, відсортовані за назвою
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [species, unknown_label]
                    properties:
                      species:
                        type: array
                        items:
                          type: object
                          required: [id, name_label]
                          properties:
                            id: { type: string }
                            name_label: { type: string, example: Білий гриб }
                            latin_label: { type: [string, 'null'], example: Boletus edulis }
                      unknown_label: { type: string, example: 'Не знаю, що це' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks/{id}:
    get:
      operationId: getPickCard
      summary: Картка тук-тука (тап по точці)
      description: |
        Фото, назва, опис, дата, статус перевірки. Свою точку бачить автор; чужу — лише
        публічну, не відхилену, у своїй області. Інакше `404 pick_not_found` (так само, як
        для неіснуючої — існування чужих приватних точок не підтверджується).
        У картці чужої точки немає автора й точного часу зйомки; місце — приблизне.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Картка
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PickCard' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-analysis:
    get:
      operationId: getAnalysisOverview
      summary: Аналіз ділянки — що доступно користувачу
      description: |
        Розміри ділянки з позначкою доступності (10×10 км — лише Pro, `lock_label`),
        збережені ділянки з лімітом на сьогодні й останнім результатом, а також чи можна
        створити ще одну (`can_create`, `create_hint_label`). Клієнт показує лише це —
        сам доступ не вирішує (ADR-015).
      responses:
        '200':
          description: Налаштування аналізу
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnalysisOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: runAnalysis
      summary: Машинний прогноз — нова ділянка або повторний аналіз збереженої
      description: |
        Два варіанти тіла:
        * `{ lat, lng, size_km }` — створити НОВУ ділянку (квадрат `size_km × size_km` з центром
          у точці) у вільному слоті й проаналізувати. Вільного слоту немає → `409 area_limit_reached`.
        * `{ area_id }` — повторний аналіз збереженої ділянки. Ділянку не пересувають
          (ADR-015 §15.4): щоб обрати інше місце, її видаляють і створюють нову.

        Відповідь: які ліси і скільки їх у ділянці, погода, найімовірніші види. Тільки рівні з
        підписами — без відсотків. Результат зберігається з ділянкою (`last_result` у GET).

        * Ділянка — тільки у своїй області (`403 outside_home_region`), і в Pro також.
        * Безкоштовно: 1 ділянка 5×5 км, базова погода, 5 аналізів на добу на ділянку (доба — за
          київським часом). Ліміт рахується на слот: «видалити → створити» його не обнуляє.
          Перевищення — `429 analysis_limit_reached` + `Retry-After`.
        * 10×10 км, до 3 ділянок і дата далі ніж +3 дні — Pro (`403 pro_required`, текст у `message`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisRequest' }
      responses:
        '200':
          description: Результат аналізу
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnalysisResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`outside_home_region`, `pro_required`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`not_found` — ділянку (area_id) не знайдено'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`area_limit_reached` — немає вільного слоту (текст у `message`), `home_region_required`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`validation_error`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`analysis_limit_reached` (добовий ліміт, + `Retry-After` до київської півночі) або `rate_limited`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1-analysis/areas/{id}:
    delete:
      operationId: deleteAnalysisArea
      summary: Видалити ділянку аналізу
      description: |
        Звільняє слот для нової ділянки (ADR-015 §15.4). Ліміт аналізів на сьогодні не скидається.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Видалено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-analysis/areas/{id}/forest:
    put:
      operationId: refineAnalysisForest
      summary: Уточнити ліс ділянки вручну й переаналізувати
      description: |
        ADR-015 §15.6. Породи — лише зі списку `forest_edit_options` (GET v1-analysis): 1–2 на
        тип лісу з карти + породи, яких карта не бачить (`extra`). `override: null` — «Скинути до
        карти». Не частіше 2 разів на добу на ділянку (`429 forest_edit_limit_reached` +
        `Retry-After`). Одразу переаналіз; добовий ліміт аналізів не списується. На загальну
        карту лісів не впливає.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties:
                override:
                  oneOf:
                    - $ref: '#/components/schemas/ForestOverride'
                    - type: 'null'
                forest:
                  $ref: '#/components/schemas/AnalysisRequest/properties/forest'
                date: { type: string, format: date }
      responses:
        '200':
          description: Уточнення збережено, результат переаналізу
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AnalysisResult'
                      - type: object
                        required: [forest_edit]
                        properties:
                          forest_edit: { $ref: '#/components/schemas/ForestEditUsage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: |
        Коди: invalid_json, invalid_body, invalid_bbox, bbox_too_large, invalid_zoom, invalid_limit,
        invalid_region_slug, invalid_detail, invalid_name, invalid_terms_version, unauthorized,
        registration_required, outside_home_region, region_change_not_allowed, not_found,
        me_not_found, region_not_found, method_not_allowed, home_region_required,
        terms_version_outdated, rate_limited (+ Retry-After), db_error, internal_error.
        Тук-тук (v1-picks): validation_error, photo_too_large, invalid_photo_format,
        photo_not_uploaded, forbidden, species_required, unknown_species, level_required,
        daily_limit_reached, storage_error, invalid_mine, pick_not_found.
        Аналіз (v1-analysis): pro_required, analysis_limit_reached (+ Retry-After), area_limit_reached,
        forest_edit_limit_reached (+ Retry-After).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Машинний код }
        message: { type: string, description: Текст для людини (UA) }

    HomeRegion:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, description: Лише для локального кешу — на сервер відправляти slug }
        slug: { type: string }
        name: { type: string }

    Me:
      type: object
      required: [id, rating, total_verified_picks, created_at, is_guest, onboarding, region_change]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        rating: { type: integer }
        total_verified_picks: { type: integer }
        home_region:
          oneOf:
            - $ref: '#/components/schemas/HomeRegion'
            - type: 'null'
        created_at: { type: string, format: date-time }
        is_guest: { type: boolean, description: Анонімний вхід (ADR-001) }
        onboarding:
          type: object
          required: [region_done, terms_done, terms_version, next_step, next_step_label]
          properties:
            region_done: { type: boolean }
            terms_done: { type: boolean }
            terms_version: { type: string }
            next_step: { type: string, enum: [select_region, accept_terms, done] }
            next_step_label: { type: string }
        region_change:
          type: object
          required: [allowed, reason_label]
          properties:
            allowed: { type: boolean }
            reason_label: { type: string }

    MeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Me' }

    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        home_region_slug: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,31}$' }
        accept_terms_version: { type: string }

    PickUploadUrlRequest:
      type: object
      required: [client_id, content_type, size_bytes]
      properties:
        client_id:
          type: string
          format: uuid
          description: UUID, який генерує клієнт; ключ ідемпотентності обох кроків
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, minimum: 1, maximum: 5242880 }

    PickUploadUrl:
      type: object
      required: [upload_url, path, token, expires_at]
      properties:
        upload_url: { type: string, format: uri, description: Сюди клієнт робить PUT файлу }
        path:
          type: string
          description: Передати без змін у POST /v1-picks
          example: 11111111-1111-4111-8111-111111111111/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jpg
        token: { type: string, description: Токен посилання (для SDK uploadToSignedUrl) }
        expires_at: { type: string, format: date-time }

    PickAiCheck:
      type: object
      description: |
        Підказка локального ШІ з телефону (ADR-018 §18.4). Не доказ — сервер лише зберігає її.
        Числові ймовірності заборонені: тільки рівні.
      required: [model_version, top, match, twin_alert]
      properties:
        model_version: { type: string, minLength: 1, maxLength: 64 }
        top:
          type: array
          maxItems: 5
          items:
            type: object
            required: [species_id, level]
            properties:
              species_id: { type: string, maxLength: 64 }
              level: { type: string, enum: [high, medium, low] }
        match: { type: boolean, description: Розпізнаний вид збігається з обраною назвою }
        twin_alert:
          type: boolean
          description: Модель бачить отруйного двійника — точка не підтверджується автоматично

    CreatePickRequest:
      type: object
      required: [client_id, path, lat, lng, captured_at, visibility, species_id]
      properties:
        client_id: { type: string, format: uuid }
        path: { type: string, description: '`path` з відповіді upload-url' }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        captured_at: { type: string, format: date-time, description: Час зйомки на пристрої }
        visibility: { type: string, enum: [private, public] }
        species_id:
          type: [string, 'null']
          maxLength: 64
          description: id виду з довідника; `null` — «Не знаю, що це» (лише для `private`)
        description:
          type: [string, 'null']
          maxLength: 500
          description: Необов'язковий опис; контакти й посилання замінюються на «…»
        ai_check:
          oneOf:
            - $ref: '#/components/schemas/PickAiCheck'
            - type: 'null'

    PickCreated:
      type: object
      description: Підписи й кольори — готові, із сервера. Координат у відповіді немає.
      required: [id, visibility, status_label, marker_color]
      properties:
        id: { type: string, format: uuid }
        visibility: { type: string, enum: [private, public] }
        status_label:
          type: string
          description: '«Приватна точка» · «Перевіряється» · «Підтверджено» · «Відхилено»'
          example: Перевіряється
        marker_color: { type: string, pattern: '^#[0-9a-f]{6}$', example: '#9e9e9e' }

    PickCreatedResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PickCreated' }

    MapPick:
      type: object
      description: Точка на карті. Підпис і колір — із сервера.
      required: [id, lat, lng, is_exact, is_mine, visibility, name_label, status_label, marker_color]
      properties:
        id: { type: string, format: uuid }
        lat: { type: number, description: Своя точка — точна широта; чужа — зсунута }
        lng: { type: number }
        is_exact: { type: boolean, description: true лише для власних точок }
        is_mine: { type: boolean }
        visibility: { type: string, enum: [private, public] }
        species_id: { type: [string, 'null'] }
        name_label: { type: string, example: Білий гриб, description: 'Назва виду або «Не знаю, що це»' }
        status_label: { type: string, example: Перевіряється }
        marker_color: { type: string, pattern: '^#[0-9a-f]{6}$', example: '#9e9e9e' }

    PickCard:
      allOf:
        - $ref: '#/components/schemas/MapPick'
        - type: object
          required: [actions]
          properties:
            description: { type: [string, 'null'] }
            date_label: { type: [string, 'null'], example: 10 листопада 2026 р. }
            captured_at:
              type: [string, 'null']
              format: date-time
              description: Точний час зйомки — лише для власної точки
            photo_url:
              type: [string, 'null']
              format: uri
              description: Тимчасове посилання на фото (10 хвилин)
            disclaimer_label:
              type: [string, 'null']
              example: Фото користувача — не порада їсти гриб
            actions:
              type: array
              description: Дозволені дії; клієнт показує лише їх (скарги — B3.12, зміна й видалення — B3.4)
              items: { type: string }

    AnalysisUsage:
      type: object
      required: [used, limit, label]
      properties:
        used: { type: integer }
        limit: { type: integer }
        label: { type: string, example: 'Сьогодні: 2 з 5 аналізів' }

    AnalysisArea:
      type: object
      required: [id, slot, lat, lng, size_km, size_label]
      properties:
        id: { type: string, format: uuid }
        slot: { type: integer, minimum: 1, maximum: 3 }
        lat: { type: number }
        lng: { type: number }
        size_km: { type: integer, enum: [5, 10] }
        size_label: { type: string, example: 5×5 км }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: '[minLng, minLat, maxLng, maxLat] — точні межі проаналізованого квадрата (у відповіді POST)'
        usage: { $ref: '#/components/schemas/AnalysisUsage' }
        last_result:
          description: Останній результат аналізу ділянки (у GET); null — ще не аналізували
          oneOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - type: 'null'
        last_analyzed_at: { type: [string, 'null'], format: date-time }
        forest_override:
          description: Уточнення лісу вручну (у GET); null — немає
          oneOf:
            - $ref: '#/components/schemas/ForestOverride'
            - type: 'null'
        forest_edit: { $ref: '#/components/schemas/ForestEditUsage' }

    ForestSpeciesCode:
      type: string
      enum: [pine, spruce, oak, birch, aspen, alder, beech, hornbeam]

    ForestOverride:
      type: object
      description: Породи, обрані користувачем для своєї ділянки (ADR-015 §15.6)
      properties:
        types:
          type: array
          maxItems: 12
          items:
            type: object
            required: [forest_type, species]
            properties:
              forest_type: { type: [string, 'null'], pattern: '^[a-z_]{1,32}$', description: Тип лісу з карти }
              species:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items: { $ref: '#/components/schemas/ForestSpeciesCode' }
        extra:
          type: array
          maxItems: 4
          items:
            type: object
            required: [species, presence]
            properties:
              species: { $ref: '#/components/schemas/ForestSpeciesCode' }
              presence: { type: string, enum: [dominant, present] }

    ForestEditUsage:
      type: object
      required: [used, limit, can_edit, label]
      properties:
        used: { type: integer }
        limit: { type: integer, example: 2 }
        can_edit: { type: boolean }
        label: { type: string, example: Уточнити ліс сьогодні можна ще 1 раз }

    AnalysisOverview:
      type: object
      required: [sizes, areas, usage, hint_label]
      properties:
        sizes:
          type: array
          items:
            type: object
            required: [size_km, label, available]
            properties:
              size_km: { type: integer, enum: [5, 10] }
              label: { type: string, example: 10×10 км }
              available: { type: boolean }
              lock_label: { type: [string, 'null'], example: Доступно в Pro }
        areas:
          type: array
          items: { $ref: '#/components/schemas/AnalysisArea' }
        usage: { $ref: '#/components/schemas/AnalysisUsage' }
        hint_label: { type: string, example: 'Торкніться карти, щоб обрати центр ділянки' }
        can_create: { type: boolean, description: Чи є вільний слот для нової ділянки }
        create_hint_label:
          type: string
          example: 'У вас уже є ділянка. Щоб створити нову, видаліть стару у вкладці «Прогноз».'
        forest_edit_options:
          type: object
          description: Список для «Уточнити ліс» (лише вибір зі списку)
          properties:
            species:
              type: array
              items:
                type: object
                required: [code, label]
                properties:
                  code: { $ref: '#/components/schemas/ForestSpeciesCode' }
                  label: { type: string, example: Сосна }
            presence:
              type: array
              items:
                type: object
                required: [code, label]
                properties:
                  code: { type: string, enum: [dominant, present] }
                  label: { type: string, example: є місцями }

    AnalysisRequest:
      type: object
      description: Або `area_id` (повторний аналіз), або `lat` + `lng` + `size_km` (нова ділянка).
      properties:
        area_id: { type: string, format: uuid }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        size_km: { type: integer, enum: [5, 10] }
        date: { type: string, format: date, description: За замовчуванням — сьогодні (київський час) }
        forest:
          type: object
          description: >-
            Ліс у квадраті, порахований застосунком із полігонів, які видно на карті
            (файл лісів області). Якщо передано — замінює дані БД (там є не всі області).
          required: [forest_km2, types]
          properties:
            forest_km2: { type: number, minimum: 0 }
            types:
              type: array
              maxItems: 12
              items:
                type: object
                required: [forest_type, km2]
                properties:
                  forest_type: { type: [string, 'null'], pattern: '^[a-z_]{1,32}$' }
                  km2: { type: number, minimum: 0 }

    AnalysisSpecies:
      allOf:
        - $ref: '#/components/schemas/ForecastSpecies'
        - type: object
          properties:
            forest_label:
              type: [string, 'null']
              example: Сосновий ліс
              description: У якому лісі ділянки шукати цей вид

    AnalysisResult:
      type: object
      required: [area, date, forest, warnings, usage]
      properties:
        area: { $ref: '#/components/schemas/AnalysisArea' }
        date: { type: string, format: date }
        forest:
          type: object
          required: [summary_label, types]
          properties:
            summary_label: { type: string, example: 'Ліс займає ≈ 9,4 км² з 25 км² ділянки' }
            types:
              type: array
              maxItems: 5
              items:
                type: object
                required: [type_label, type_color, area_label]
                properties:
                  forest_type: { type: [string, 'null'] }
                  type_label: { type: string, example: Сосновий ліс }
                  type_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
                  area_label: { type: string, example: '≈ 8,4 км²' }
                  age_label: { type: [string, 'null'], example: '~60 р.' }
                  species:
                    type: array
                    items: { $ref: '#/components/schemas/ForestSpeciesCode' }
                  species_label: { type: [string, 'null'], example: 'сосна, ялина · уточнено вами' }
            extra:
              type: array
              items:
                type: object
                required: [species, label, presence, presence_label]
                properties:
                  species: { $ref: '#/components/schemas/ForestSpeciesCode' }
                  label: { type: string, example: Дуб }
                  presence: { type: string, enum: [dominant, present] }
                  presence_label: { type: string, example: є місцями · уточнено вами }
            refined: { type: boolean, description: Ліс уточнено вручну }
            refine_note_label: { type: [string, 'null'] }
        top1:
          oneOf:
            - $ref: '#/components/schemas/AnalysisSpecies'
            - type: 'null'
        alternative:
          oneOf:
            - $ref: '#/components/schemas/AnalysisSpecies'
            - type: 'null'
        weather:
          description: Базова погода (безкоштовно) — температура, вологість, опади
          oneOf:
            - type: object
              required: [icon, temp_label, humidity_label, rain_label]
              properties:
                icon: { type: string, enum: [sun, cloud, rain, unknown] }
                temp_label: { type: string }
                humidity_label: { type: string }
                rain_label: { type: string }
            - type: 'null'
        warnings: { type: array, items: { type: string } }
        usage: { $ref: '#/components/schemas/AnalysisUsage' }
        no_data_reason: { type: string }

    RegionGeometry:
      type: object
      required: [id, slug, name, bbox, center, zoom, geometry, forests]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: '[minLng, minLat, maxLng, maxLat]'
        center:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: '[lng, lat]'
        zoom: { type: integer, minimum: 5, maximum: 12 }
        geometry: { type: object, description: GeoJSON MultiPolygon }
        forests:
          type: object
          description: |
            Ліси області одним файлом (той самий формат, що й /v1-forest-zones, gzip).
            Застосунок перевіряє meta (version) і завантажує data_url лише при зміні версії.
            Якщо файлу ще немає (404) — запасний шлях /v1-forest-zones.
          required: [meta_url, data_url]
          properties:
            meta_url: { type: string, format: uri }
            data_url: { type: string, format: uri }

    ForestFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              id: { type: string }
              geometry: { type: object }
              properties:
                type: object
                required: [id, type_label, type_color]
                properties:
                  id: { type: string }
                  forest_type: { type: [string, 'null'] }
                  stand_age_years: { type: [integer, 'null'] }
                  type_label: { type: string }
                  type_color: { type: string, pattern: '^#[0-9a-f]{6}$' }

    ForecastRequest:
      type: object
      required: [lat, lng, date]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        date: { type: string, format: date }
        forestType: { type: string, maxLength: 32 }

    ForecastSpecies:
      type: object
      required: [mushroom_type, name_ua, level, level_label, level_color, when_label, where_label, why_labels]
      properties:
        mushroom_type: { type: string }
        name_ua: { type: string }
        level: { type: string, enum: [peak, high, medium, low, no_data] }
        level_label: { type: string }
        level_color: { type: string }
        when_label: { type: string, example: 'Зараз — 3 дні після дощу · Осіння хвиля' }
        where_label: { type: string }
        why_labels:
          type: array
          maxItems: 4
          items: { type: string }
          example: ['Температура 13° — підходить для плодоношення', 'Дощ 16 мм за останні 3 дні']
        limit_labels:
          type: array
          maxItems: 4
          description: Що знижує рівень (показується з попередженням, не з «✓»)
          items: { type: string }
          example: ['Вологість 55% — замало (краще від 70%)', 'Сухий ґрунт']

    ForecastWeather:
      type: object
      description: Блок погоди з готовими рядками (B2.3). null, якщо погода недоступна.
      required: [icon, temp_label, humidity_label, rain_label, rain_recent_label, pressure_label]
      properties:
        icon: { type: string, enum: [sun, cloud, rain, unknown] }
        temp_label: { type: string, example: '9°…17°, у середньому 13° за тиждень' }
        humidity_label: { type: string, example: 'Вологість 78%' }
        rain_label: { type: string, example: 'Опади: 16 мм за 3 дні, 21 мм за тиждень' }
        rain_recent_label: { type: string, example: 'Сильний дощ 3 дні тому' }
        pressure_label: { type: string, example: 'Тиск 1013 гПа, стабільний' }

    Forecast:
      type: object
      required: [date, forest, forest_label, warnings]
      properties:
        regionName: { type: [string, 'null'] }
        date: { type: string, format: date }
        forest: { type: string, description: Технічний рядок рушія (застаріле — використовуйте forest_label) }
        forest_label: { type: string, example: 'Сосновий ліс' }
        weather:
          oneOf:
            - $ref: '#/components/schemas/ForecastWeather'
            - type: 'null'
        top1:
          oneOf:
            - $ref: '#/components/schemas/ForecastSpecies'
            - type: 'null'
        alternative:
          oneOf:
            - $ref: '#/components/schemas/ForecastSpecies'
            - type: 'null'
        warnings: { type: array, items: { type: string } }
        noDataReason: { type: string }
