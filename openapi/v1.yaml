openapi: 3.1.0
info:
  title: Грибний Радар — клієнтський API v1
  version: 1.0.0
  description: |
    Ендпоінти `v1-*` для Flutter-клієнта (BACKEND_PLAN: робочий блок 1, Тук-тук B3.0–B3.3,
    аналіз ділянки B2.9).

    * Базовий URL: `https://<PROJECT_REF>.supabase.co/functions/v1`
    * Кожен запит: заголовок `apikey: <SUPABASE_ANON_KEY>`.
    * Гість (ADR-001) входить через Anonymous Sign-In і має звичайний JWT.
    * Успіх: `{ "data": ... }`. Помилка: `{ "error": "snake_case", "message"?: "текст UA" }`.
    * Числових ймовірностей у відповідях немає (маніфест, Заборона №1).
servers:
  - url: https://{projectRef}.supabase.co/functions/v1
    variables:
      projectRef:
        default: PROJECT_REF

security:
  - apikey: []
    bearerAuth: []

paths:
  /v1-me:
    get:
      operationId: getMe
      summary: Профіль (ім'я, @нік, аватар, рівень), стан онбордингу і право змінити область
      parameters:
        - name: check_handle
          in: query
          required: false
          description: >-
            Перевірити, чи вільний нік (підказка під полем вводу) — тоді відповідь
            `{ data: { handle, available, reason } }` замість профілю.
          schema: { type: string, example: Олена_лісова }
        - name: avatars
          in: query
          required: false
          description: 'Вибір готового аватара — відповідь { data: { current: { kind, id }, can_change, reason_label, groups: [{ level, label, open, lock_label, avatars: [{ id, title, role, open }] }] } }; гостю can_change = false'
          schema: { type: string, example: '1' }
        - name: trophies
          in: query
          required: false
          description: >-
            Трофеї-медальйони (ADR-021 §21.10): сервер перераховує показники, записує нові й відповідає
            { data: { trophies: [{ id, title, tier, tier_label, how_label, earned, earned_at, progress_label,
            progress, soon }], earned_count, total, new_labels } }. Гість — 403 registration_required.
          schema: { type: string, example: '1' }
      responses:
        '200':
          description: Профіль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      summary: Онбординг і профіль (ім'я, нік, аватар, Home Region, згода з умовами)
      description: |
        * Ім'я, нік і аватар — лише після входу через Google / Apple; гостю `403 registration_required`
          (ADR-021 §21.2.1). Нік — лише українські літери, цифри, `_`, `.`, апостроф; 3–20; унікальний
          без урахування великих літер (`409 handle_taken`); змінювати раз на 30 днів
          (`409 handle_change_too_soon`). Ім'я — українські літери, пробіл, дефіс, апостроф; 2–30.
        * Перший вибір області — вільний.
        * Повторна зміна (ADR-016): одне безкоштовне виправлення протягом 24 год після першого
          вибору; далі — тільки Pro (один раз) або підтримка → `403 region_change_not_allowed`.
        * `accept_terms_version` має дорівнювати `onboarding.terms_version` з `GET /v1-me`,
          інакше `409 terms_version_outdated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Оновлений профіль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMe
      summary: Видалити акаунт назавжди (вимога Google Play)
      description: 'Каскадно — профіль, точки, ділянки, згоди. Відповідь { data: { deleted: true } }.'
      responses:
        '200': { description: Акаунт видалено }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-regions/{slug}/geometry:
    get:
      operationId: getRegionGeometry
      summary: Кордон області для маски «острова»
      security:
        - apikey: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,31}$' }
        - name: detail
          in: query
          schema: { type: string, enum: [low, medium, high], default: medium }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Кордон області (кешується 24 год, ETag)
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RegionGeometry' }
        '304': { description: Не змінилось }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-forest-zones:
    get:
      operationId: getForestZones
      summary: Полігони лісів — тільки в межах Home Region користувача
      parameters:
        - name: bbox
          in: query
          description: 'minLng,minLat,maxLng,maxLat — видима частина карти; без bbox — уся область'
          schema: { type: string, example: '30.2,50.2,30.9,50.7' }
        - name: z
          in: query
          description: Масштаб карти (0..22) — для спрощення геометрії
          schema: { type: integer, minimum: 0, maximum: 22 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 5000 }
      responses:
        '200':
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ForestFeatureCollection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-forecast:
    post:
      operationId: getForecast
      summary: Прогноз для точки в межах Home Region
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForecastRequest' }
      responses:
        '200':
          description: Прогноз
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Forecast' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks/upload-url:
    post:
      operationId: createPickUploadUrl
      summary: Тук-тук, крок 1 — посилання для завантаження фото
      description: |
        Фото ніколи не передається як base64 (ADR-002). Потік:

        1. `POST /v1-picks/upload-url` → `upload_url`, `path`.
        2. `PUT <upload_url>` — тіло запиту це файл, заголовок `Content-Type` — тип фото.
           Без заголовків `Authorization` / `apikey`: посилання вже містить дозвіл.
        3. `POST /v1-picks` з тим самим `client_id` і отриманим `path`.

        Повторний виклик з тим самим `client_id` повертає нове посилання на **той самий**
        шлях — так офлайн-черга безпечно повторює крок. Посилання діє до `expires_at`.
        Доступно гостю (ADR-001). Потрібен обраний Home Region.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickUploadUrlRequest' }
      responses:
        '200':
          description: Посилання для завантаження
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PickUploadUrl' }
        '400':
          description: '`photo_too_large` (понад 5 МіБ), `invalid_photo_format` (не JPEG / PNG / WebP), `invalid_json`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422':
          description: '`validation_error` — некоректні `client_id` або `size_bytes`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks:
    post:
      operationId: createPick
      summary: Тук-тук, крок 3 — створити точку
      description: |
        Створює точку з фото, яке вже завантажено за `upload_url` (ADR-002, ADR-018).

        * Видимість — лише `private` або `public`. Гість створює тільки `private`
          (`403 registration_required`).
        * Точка має бути в Home Region користувача (`403 outside_home_region`).
        * `species_id: null` — «Не знаю, що це»; така точка може бути лише приватною
          (`422 species_required`).
        * Ліміти (ADR-019 §19.10; Pro — пізніше): приватні — до 5 одночасно
          (`429 private_limit_reached`) і до 10 нових за 7 днів; публічні — з рівня «Лісовик»
          (`403 level_required`): Лісовик 7, Хранитель лісу 15 за 7 днів (`429 weekly_limit_reached`).
          Приватна точка з фото, знятим на місці (EXIF), дає +1 бал рейтингу, до 5 за 7 днів.
          Текст для користувача — у `message`.
        * `ai_check` — підказка локального ШІ з телефону, а не доказ: рівні словами, без
          відсотків. Сервер ШІ не запускає (ADR-006).
        * Статус нової публічної точки завжди «Перевіряється»: підтверджують люди.
        * Сервер вирізає з фото EXIF та інші метадані. Іншим користувачам публічна точка
          показується зі стабільним зсувом 300–500 м; точні координати бачить лише автор.
        * Ідемпотентність: повтор з тим самим `client_id` → `200` з тією самою точкою.
        * У `description` телефони, e-mail, посилання і @нікнейми замінюються на «…».
        * `reply_to` (B3.8, ADR-019 §19.5) — відповідь знахідкою на чужу публічну точку: лише `public`, той самий
          вид. До створення — `404 pick_not_found`, `422 own_pick` / `species_mismatch`, `409 already_confirmed` /
          `attempts_exhausted` (не більше 2 спроб на точку). Після створення в `confirmation` — чи зараховано:
          ≤ 200 м від справжнього місця, фото з перевіреним місцем, взаємні підтвердження двох людей — до 3 за
          30 днів. Не зараховано — точка лишається звичайною публічною точкою автора відповіді.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickRequest' }
      responses:
        '201':
          description: Точку створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickCreatedResponse' }
        '200':
          description: Повтор запиту (той самий `client_id`) — точка вже існує, дубля немає
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickCreatedResponse' }
        '400':
          description: '`photo_too_large`, `invalid_photo_format` (завантажений файл не є JPEG / PNG / WebP), `invalid_json`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`registration_required` (гість + public), `forbidden` (чужий `path`), `outside_home_region`, `level_required`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422':
          description: '`validation_error`, `species_required`, `unknown_species`, `photo_not_uploaded`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`private_limit_reached` (5 приватних одночасно), `weekly_limit_reached` (тижневий ліміт точок) або `rate_limited` (+ `Retry-After`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1-picks/map:
    get:
      operationId: getPicksMap
      summary: Тук-туки на карті Home Region
      description: |
        Публічні точки інших людей у своїй області (сірі — «Перевіряється», зелені —
        «Підтверджено»; відхилені не показуються) і власні точки. `mine=true` додає власні
        приватні (перемикач «Приватні точки», ADR-018 §18.2).

        **Приватність (ADR-018 §18.5).** Для чужих точок `lat` / `lng` — зсунуте місце
        (300–500 м від справжнього, зсув стабільний), `is_exact: false`. Точні координати —
        лише автору. Фільтр `bbox` для чужих точок теж працює за зсунутим місцем.
      parameters:
        - name: bbox
          in: query
          description: 'minLng,minLat,maxLng,maxLat — видима частина карти; без bbox — уся область'
          schema: { type: string, example: '30.2,50.2,30.9,50.7' }
        - name: mine
          in: query
          description: Показати й власні приватні точки
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Точки (не більше 500; якщо їх більше — `truncated`)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [points, truncated]
                    properties:
                      points:
                        type: array
                        items: { $ref: '#/components/schemas/MapPick' }
                      truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks/species:
    get:
      operationId: getPickSpecies
      summary: Список видів для вибору назви тук-тука
      description: |
        Назва точки — тільки зі списку довідника (ADR-018 §18.3). `unknown_label` — варіант
        «Не знаю, що це» (`species_id: null`; така точка може бути лише приватною).
        Відповідь можна кешувати на годину.
      responses:
        '200':
          description: Види, відсортовані за назвою
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [species, unknown_label]
                    properties:
                      species:
                        type: array
                        items:
                          type: object
                          required: [id, name_label]
                          properties:
                            id: { type: string }
                            name_label: { type: string, example: Білий гриб }
                            latin_label: { type: [string, 'null'], example: Boletus edulis }
                      unknown_label: { type: string, example: 'Не знаю, що це' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-picks/{id}:
    get:
      operationId: getPickCard
      summary: Картка тук-тука (тап по точці)
      description: |
        Фото, назва, опис, дата, статус перевірки. Свою точку бачить автор; чужу — лише
        публічну, не відхилену, у своїй області. Інакше `404 pick_not_found` (так само, як
        для неіснуючої — існування чужих приватних точок не підтверджується).
        У картці чужої точки немає автора й точного часу зйомки; місце — приблизне.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Картка
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PickCard' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updatePick
      summary: Змінити свою точку — видимість і опис (B3.4)
      description: |
        Лише автор. Фото й вид після створення не змінюються. `private → public`: потрібен вид
        (не «Не знаю»), рівень «Лісовик»+ і тижневий ліміт публічних (рахується за датою
        публікації); зсунуте місце рахує сервер. `public → private`: до 5 приватних одночасно.
        `description: null` прибирає опис; контакти в описі вирізаються. Гість не публікує.
        Чужа, видалена чи неіснуюча точка — `404 pick_not_found`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                visibility: { type: string, enum: [private, public] }
                description: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Змінена точка
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, visibility, status_label, marker_color, description]
                    properties:
                      id: { type: string, format: uuid }
                      visibility: { type: string, enum: [private, public] }
                      status_label: { type: string }
                      marker_color: { type: string }
                      description: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deletePick
      summary: Видалити свою точку (soft delete, B3.4)
      description: |
        Лише автор. Точка зникає з карти й стрічок; у ліміти видалені точки й далі рахуються
        (створив → видалив → створив ліміт не обходить). Чужа, вже видалена чи неіснуюча —
        `404 pick_not_found`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Видалено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-analysis:
    get:
      operationId: getAnalysisOverview
      summary: Аналіз ділянки — що доступно користувачу
      description: |
        Розміри ділянки з позначкою доступності (10×10 км — лише Pro, `lock_label`),
        збережені ділянки з лімітом на сьогодні й останнім результатом, а також чи можна
        створити ще одну (`can_create`, `create_hint_label`). Клієнт показує лише це —
        сам доступ не вирішує (ADR-015).
      responses:
        '200':
          description: Налаштування аналізу
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnalysisOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: runAnalysis
      summary: Машинний прогноз — нова ділянка або повторний аналіз збереженої
      description: |
        Два варіанти тіла:
        * `{ lat, lng, size_km }` — створити НОВУ ділянку (квадрат `size_km × size_km` з центром
          у точці) у вільному слоті й проаналізувати. Вільного слоту немає → `409 area_limit_reached`.
        * `{ area_id }` — повторний аналіз збереженої ділянки. Ділянку не пересувають
          (ADR-015 §15.4): щоб обрати інше місце, її видаляють і створюють нову.

        Відповідь: які ліси і скільки їх у ділянці, погода, найімовірніші види. Тільки рівні з
        підписами — без відсотків. Результат зберігається з ділянкою (`last_result` у GET).

        * Ділянка — тільки у своїй області (`403 outside_home_region`), і в Pro також.
        * Безкоштовно: 1 ділянка 5×5 км, базова погода, 5 аналізів на добу на ділянку (доба — за
          київським часом). Ліміт рахується на слот: «видалити → створити» його не обнуляє.
          Перевищення — `429 analysis_limit_reached` + `Retry-After`.
        * 10×10 км, до 3 ділянок і дні 4–7 — Pro (`403 pro_required`, текст у `message`); далі 7 днів — 422.
        * Один аналіз рахує всі дні горизонту (`days[]`: безкоштовно 3, Pro 7, від сьогодні; дні 5–7 —
          «орієнтовно»), `best_day` і дні під замком Pro (`locked_days`). ADR-015 §15.7.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisRequest' }
      responses:
        '200':
          description: Результат аналізу
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnalysisResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`outside_home_region`, `pro_required`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`not_found` — ділянку (area_id) не знайдено'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`area_limit_reached` — немає вільного слоту (текст у `message`), `home_region_required`, `already_fresh` — щоденне оновлення вже було сьогодні'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`validation_error`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`analysis_limit_reached` (добовий ліміт, + `Retry-After` до київської півночі) або `rate_limited`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1-analysis/feedback:
    get:
      operationId: getTripFeedbackPrompt
      summary: «Знайшли?» — чи питати після походу (B3.11, ADR-014)
      description: >-
        Після «Я вдома» застосунок передає середину треку й день. Сервер шукає зв'язок: прогноз ділянки, отриманий
        на цей день (похід у межах 5 км від ділянки), або завершений похід із Наглядачем за 12 год (трек у межах 5 км).
        Немає зв'язку або вже відповіли — ask = false. Місце не зберігається.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: day, in: query, required: false, description: 'Київська дата походу; за замовчуванням сьогодні', schema: { type: string, format: date } }
      responses:
        '200':
          description: Чи питати й готові тексти
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [ask]
                    properties:
                      ask: { type: boolean }
                      title: { type: string, example: 'Знайшли гриби?' }
                      subtitle: { type: string, example: 'Біля ділянки «Біля Броників»' }
                      explain_label: { type: string, description: 'ADR-014 §14.1: навіщо чесна відповідь' }
                      answers:
                        type: array
                        items: { type: object, properties: { id: { type: string, enum: [found, not_found] }, label: { type: string } } }
                      skip_label: { type: string, example: 'Не зараз' }
                      points_label: { type: [string, 'null'] }
                      accuracy_label: { type: [string, 'null'], example: 'Прогноз для вас збувся 3 з 4 разів' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: submitTripFeedback
      summary: Відповідь «Знайшли? Так / Ні»
      description: >-
        Сервер сам знаходить зв'язок походу (як у GET). +2 бали — лише акаунту, один відгук із балами на добу,
        нараховуються через 24 год, якщо довіра (users.feedback_trust) не нижче 0,5. «Не знайшов» там, де людина того ж
        дня поставила свою точку з фото, знижує довіру. У калібрування йде лише «знайшов» (ADR-019 §19.9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, answer]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                day: { type: string, format: date, description: 'Сьогодні або вчора (Київ)' }
                answer: { type: string, enum: [found, not_found] }
      responses:
        '200':
          description: Прийнято
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message_label: { type: string, example: 'Дякуємо! Записали: знайшли' }
                      points: { type: string, enum: [pending, none] }
                      points_label: { type: [string, 'null'], example: '+2 бали — через добу, після перевірки' }
                      accuracy_label: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-analysis/push:
    put:
      operationId: registerPushDevice
      summary: Пристрій для сповіщень «Почалась хвиля»
      description: ADR-015 §15.8 п.19. Сповіщення надсилаються лише в Pro або з рівня «Слідопит» — відповідь каже, чи доступні.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 20, maxLength: 4096 }
                platform: { type: string, enum: [android, ios] }
                wave_alerts: { type: boolean, default: true }
      responses:
        '200':
          description: Зареєстровано
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      registered: { type: boolean }
                      wave_alerts: { type: boolean }
                      allowed: { type: boolean }
                      locked_label: { type: [string, 'null'], example: 'Сповіщення про хвилі — у Pro або з рівня «Слідопит»' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1-analysis/areas/{id}:
    put:
      operationId: renameAnalysisArea
      summary: Назва ділянки
      description: |
        ADR-015 §15.9. Грибник підписує ділянку («Біля Броників»): до 24 символів, пробіли
        обрізаються; порожньо або null — знову «Ділянка N». Ліміт аналізів не витрачається.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: [string, 'null'], maxLength: 24 }
      responses:
        '200':
          description: Назву збережено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, label, title]
                    properties:
                      id: { type: string, format: uuid }
                      label: { type: [string, 'null'] }
                      title: { type: string, example: Біля Броників }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAnalysisArea
      summary: Видалити ділянку аналізу
      description: |
        Звільняє слот для нової ділянки (ADR-015 §15.4). Ліміт аналізів на сьогодні не скидається.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Видалено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-analysis/areas/{id}/forest:
    put:
      operationId: refineAnalysisForest
      summary: Уточнити ліс ділянки вручну й переаналізувати
      description: |
        ADR-015 §15.6. Породи — лише зі списку `forest_edit_options` (GET v1-analysis): 1–2 на
        тип лісу з карти + породи, яких карта не бачить (`extra`). `override: null` — «Скинути до
        карти». Не частіше 2 разів на добу на ділянку (`429 forest_edit_limit_reached` +
        `Retry-After`). Одразу переаналіз; добовий ліміт аналізів не списується. На загальну
        карту лісів не впливає.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties:
                override:
                  oneOf:
                    - $ref: '#/components/schemas/ForestOverride'
                    - type: 'null'
                forest:
                  $ref: '#/components/schemas/AnalysisRequest/properties/forest'
                date: { type: string, format: date }
      responses:
        '200':
          description: Уточнення збережено, результат переаналізу
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AnalysisResult'
                      - type: object
                        required: [forest_edit]
                        properties:
                          forest_edit: { $ref: '#/components/schemas/ForestEditUsage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }


  /v1-app-config:
    get:
      operationId: getAppConfig
      summary: Тексти вкладки «Безпека» — банер ДСНС, довідки, чек-лист, поради на час тривоги (ADR-003, ADR-022)
      description: >
        Публічний (гостю теж). Типові тексти + `feature_flags` `safety_notices` / `safety_content`;
        змінюються без релізу застосунку. Застосунок вбудовує ті самі типові тексти (офлайн).
      security:
        - apikey: []
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Тексти безпеки (кеш 1 год, ETag)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [safety]
                    properties:
                      safety:
                        type: object
                        required: [version, notices, guides, checklist, air_alert]
                        properties:
                          version: { type: integer }
                          notices:
                            type: array
                            items:
                              type: object
                              required: [id, title, body, severity]
                              properties:
                                id: { type: string }
                                title: { type: string }
                                body: { type: string }
                                link_label: { type: [string, 'null'] }
                                link_url: { type: [string, 'null'], description: 'лише https' }
                                severity: { type: string, enum: [danger, warning, info] }
                          guides:
                            type: array
                            items:
                              type: object
                              required: [id, title, subtitle, sections]
                              properties:
                                id: { type: string, example: lost }
                                title: { type: string }
                                subtitle: { type: string }
                                sections:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      title: { type: [string, 'null'] }
                                      items: { type: array, items: { type: string } }
                          checklist:
                            type: array
                            items:
                              type: object
                              required: [id, label]
                              properties:
                                id: { type: string }
                                label: { type: string }
                          air_alert:
                            type: object
                            properties:
                              title: { type: string }
                              tips: { type: array, items: { type: string } }
        '304': { description: Не змінилось }
        '429': { $ref: '#/components/responses/Error' }

  /v1-air-alerts:
    get:
      operationId: getAirAlerts
      summary: Повітряна тривога по областях (alerts.in.ua, ADR-022 §22.5 п.5)
      description: >
        Публічний. Без ключа `ALERTS_IN_UA_TOKEN` на сервері або при збої джерела — `available: false`
        (застосунок банер не показує). Один запит до alerts.in.ua на всю Україну, кеш 45 с спільний для
        всіх копій функції (таблиця air_alerts_cache), If-Modified-Since, пауза після 429.
      security:
        - apikey: []
      parameters:
        - name: region
          in: query
          required: false
          description: slug області — лише її тривоги
          schema: { type: string, example: zhytomyrska }
      responses:
        '200':
          description: Активні повітряні тривоги в областях застосунку
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [available, regions]
                    properties:
                      available: { type: boolean }
                      updated_at: { type: [string, 'null'], format: date-time }
                      regions:
                        type: array
                        items:
                          type: object
                          required: [slug, scope, title]
                          properties:
                            slug: { type: string, example: zhytomyrska }
                            scope: { type: string, enum: [oblast, part] }
                            title: { type: string, example: 'Повітряна тривога в області' }
        '429': { $ref: '#/components/responses/Error' }

  /v1-friends:
    get:
      operationId: getFriends
      summary: Друзі, запити, заблоковані; пошук за ніком; публічний профіль (ADR-021 §21.1, §21.2)
      description: >
        Лише акаунт із ніком (гість — 403 registration_required, без ніка — 409 profile_required).
        Без параметрів — мої друзі, вхідні й вихідні запити, заблоковані. `q` — пошук за початком
        @ніка (від 2 літер; без телефонів і email). `user` — публічний профіль за id або ніком (без
        області, координат, телефону, email і точок); той, хто мене заблокував, — 404 user_not_found.
        Кнопки (`actions`) і підписи — із сервера.
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, example: оле } }
        - { name: user, in: query, required: false, schema: { type: string, example: Олена_лісова } }
      responses:
        '200':
          description: Список / результати пошуку / профіль
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      friends: { type: array, items: { $ref: '#/components/schemas/FriendCard' } }
                      incoming: { type: array, items: { $ref: '#/components/schemas/FriendCard' } }
                      outgoing: { type: array, items: { $ref: '#/components/schemas/FriendCard' } }
                      blocked: { type: array, items: { $ref: '#/components/schemas/FriendCard' } }
                      counts:
                        type: object
                        properties:
                          friends: { type: integer }
                          incoming: { type: integer }
                      limits:
                        type: object
                        properties:
                          max_friends: { type: integer, example: 200 }
                          label: { type: string }
                      my_handle: { type: string }
                      results: { type: array, items: { $ref: '#/components/schemas/FriendCard' } }
                      hint_label: { type: [string, 'null'] }
                      profile:
                        description: 'Публічний профіль — лише аватар із рівнем, трофеї й подарунки; без балів, прогресу й кількості друзів (PO 2026-11-21)'
                        allOf:
                          - $ref: '#/components/schemas/FriendCard'
                          - type: object
                            properties:
                              is_me: { type: boolean }
                              trophies: { type: array, items: { type: object } }
                              gifts: { type: array, items: { type: object } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: friendAction
      summary: Запит у друзі, прийняти, відхилити, скасувати, видалити, заблокувати, розблокувати, поскаржитися
      description: >
        Ліміти (SQL friend_action, атомарно): до 20 нових запитів на добу (429 daily_limit), до 200
        друзів (409 friends_limit / friends_limit_other), повтор після відхилення — через 30 днів (429
        request_cooldown). Зустрічний запит = прийняти. Push — лише «запит у друзі» і «прийнято», без
        координат; відхилення, видалення й блок — мовчки. Блок ховає все в обидва боки.
        `report` — скарга (причина обов'язкова), з `block: true` — ще й блок.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, user_id]
              properties:
                action: { type: string, enum: [request, accept, decline, cancel, remove, block, unblock, report] }
                user_id: { type: string, format: uuid }
                reason: { type: string, enum: [spam, abuse, impersonation, inappropriate, other] }
                comment: { type: [string, 'null'], maxLength: 500 }
                block: { type: boolean }
      responses:
        '200':
          description: Новий стан пари
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: '#/components/schemas/FriendCard' }
                      done_label: { type: [string, 'null'], example: Запит надіслано }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: registerSocialPush
      summary: Пристрій для push друзів і Наглядача (PUT v1-friends/push)
      description: Токен FCM; налаштування «Почалась хвиля» не змінює.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [android, ios] }
      responses:
        '200':
          description: Зареєстровано
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      registered: { type: boolean }
        '422': { $ref: '#/components/responses/Error' }

  /v1-guardian:
    get:
      operationId: getGuardian
      summary: Наглядач — мої Наглядачі, прохання, за ким я дивлюсь, мій похід; або похід за id (ADR-022)
      description: >
        Лише акаунт із ніком (гість — 403 registration_required). Без параметрів — огляд. `hike` —
        похід для власника чи Наглядача незакритого походу: статус, останнє місце, батарея, маршрут, трек
        (`since` — лише нові точки), `rescue` (координати великими цифрами й текст SMS на 112, без
        посилань). Чужий або закритий похід — 404 hike_not_found (B4.9).
      security:
        - bearerAuth: []
      parameters:
        - { name: hike, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Огляд або похід
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      guardians: { type: array, items: { type: object }, description: Мої Наглядачі (status pending / accepted, actions) }
                      invites: { type: array, items: { type: object }, description: Мене просять бути Наглядачем }
                      watching: { type: array, items: { type: object }, description: Я Наглядач для цих друзів }
                      hike: { type: [object, 'null'], description: 'Мій незакритий похід: status, status_label, detail_label, ask_ok, expected_return, guardians, actions — або похід за ?hike= (route, track, rescue, last, battery_label, gps_issue_label)' }
                      watched: { type: array, items: { type: object }, description: Походи друзів, де я Наглядач (тривожні згори) }
                      limits:
                        type: object
                        properties:
                          max_guardians_per_hike: { type: integer, example: 1 }
                          label: { type: string }
                      telegram:
                        type: object
                        properties:
                          available: { type: boolean }
                          linked: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: guardianAction
      summary: Наглядачі (згода один раз), «Йду в ліс», трек, «Все добре?», SOS, «Я вдома», Telegram
      description: >
        invite / accept_invite / decline_invite / remove / resign — `user_id`; лише друзі (403 not_friends).
        start — `route` (обов'язково, 422 route_required), `expected_return` (за 10 хв … 24 год),
        `guardian_ids` (Наглядачі, що погодились; 1 безкоштовно, до 3 — Pro: 403 pro_required),
        `client_id` (повтор без дубля). track — `hike_id`, `points` [{lat, lng, t, acc}] до 500, `battery`;
        точки з точністю гіршою за 100 м — у треку з позначкою, не «останнє місце». ok / extend / sos /
        sos_cancel / finish — `hike_id`. Push і Telegram Наглядачам — без координат. Після finish трек
        видаляється. telegram_link → `url` на бота з одноразовим кодом (15 хв).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [invite, accept_invite, decline_invite, remove, resign, start, track, ok, extend, sos, sos_cancel, finish, telegram_link, telegram_unlink]
                user_id: { type: string, format: uuid }
                hike_id: { type: string, format: uuid }
                client_id: { type: string, maxLength: 64 }
                route:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [lat, lng]
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      label: { type: string, maxLength: 40 }
                expected_return: { type: string, format: date-time }
                guardian_ids: { type: array, items: { type: string, format: uuid }, maxItems: 3 }
                checklist_done: { type: boolean, description: 'start: перед стартом пройдено чек-лист (трофей «Готовий до лісу»)' }
                used_home_nav: { type: boolean, description: 'finish: повернулися за допомогою «Додому» (трофей «Своїм слідом»)' }
                points:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [lat, lng, t]
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      t: { type: string, format: date-time }
                      acc: { type: number }
                battery: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Новий стан
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: |
        Коди: invalid_json, invalid_body, invalid_bbox, bbox_too_large, invalid_zoom, invalid_limit,
        invalid_region_slug, invalid_detail, invalid_name, invalid_terms_version, unauthorized,
        registration_required, outside_home_region, region_change_not_allowed, not_found,
        me_not_found, region_not_found, method_not_allowed, home_region_required,
        terms_version_outdated, rate_limited (+ Retry-After), db_error, internal_error.
        Тук-тук (v1-picks): validation_error, photo_too_large, invalid_photo_format,
        photo_not_uploaded, forbidden, species_required, unknown_species, level_required,
        private_limit_reached, weekly_limit_reached, storage_error, invalid_mine, pick_not_found.
        Аналіз (v1-analysis): pro_required, analysis_limit_reached (+ Retry-After), area_limit_reached,
        forest_edit_limit_reached (+ Retry-After).
        Друзі (v1-friends): profile_required, invalid_action, invalid_user_id, invalid_reason,
        invalid_comment, invalid_target, user_not_found, blocked_by_you, request_cooldown,
        daily_limit, friends_limit, friends_limit_other, no_request.
        Наглядач (v1-guardian): not_friends, guardians_limit, no_invite, route_required,
        guardian_required, guardian_not_accepted, pro_required, hike_already_active, hike_not_found,
        hike_closed, no_sos, extend_limit, telegram_unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Машинний код }
        message: { type: string, description: Текст для людини (UA) }

    FriendCard:
      type: object
      required: [id, handle, avatar, level, relation, actions]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, example: Олена_лісова }
        name: { type: [string, 'null'] }
        avatar: { type: object, description: 'Готовий аватар { kind: preset, id }, картинка assets/avatars/<id>.webp' }
        level:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
        relation: { type: string, enum: [none, outgoing, incoming, friends, blocked] }
        relation_label: { type: [string, 'null'] }
        since: { type: string, format: date-time }
        actions:
          type: array
          items:
            type: object
            required: [id, label, style]
            properties:
              id: { type: string, enum: [request, accept, decline, cancel, remove, block, unblock, report] }
              label: { type: string }
              style: { type: string, enum: [primary, secondary, menu, danger] }
              confirm_label: { type: [string, 'null'] }

    HomeRegion:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, description: Лише для локального кешу — на сервер відправляти slug }
        slug: { type: string }
        name: { type: string }

    Me:
      type: object
      required: [id, rating, total_verified_picks, created_at, is_guest, onboarding, region_change]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        handle: { type: [string, 'null'], description: "Нік без «@»; у гостя — null" }
        avatar:
          type: object
          description: 'Готовий аватар (ADR-021 §21.7, PO 2026-11-21; конструктора немає): traveler_01 … master_04, за замовчуванням і для старих наліпок/грибів — traveler_01'
          properties:
            kind: { type: string, enum: [preset] }
            id: { type: string, example: traveler_01 }
        level:
          type: object
          description: Рівень за рейтингом (ADR-013) і підпис прогресу
          properties:
            id: { type: string }
            label: { type: string, example: Слідопит }
            from: { type: integer }
            to: { type: [integer, 'null'] }
            next_label: { type: [string, 'null'] }
            progress_label: { type: string, example: '120 балів · ще 81 бал до рівня «Лісовик»' }
        handle_change:
          type: object
          properties:
            allowed: { type: boolean }
            reason_label: { type: string }
        picks:
          type: [object, 'null']
          description: 'Чи можна зараз створити точку (PROD-001b, ADR-019 §19.10): вирішує та сама БД-функція, що й при створенні; null — дізнатися не вдалося (застосунок покаже відповідь на створення)'
          properties:
            public_allowed: { type: boolean }
            public_hint_label: { type: [string, 'null'], description: 'Чому ні: гість — вхід; рівень — з «Лісовика»; тижневий ліміт' }
            private_allowed: { type: boolean }
            private_hint_label: { type: [string, 'null'], description: 'Чому ні: «У вас 5 з 5 — видаліть одну» або тижневий ліміт' }
        rating: { type: integer }
        total_verified_picks: { type: integer }
        home_region:
          oneOf:
            - $ref: '#/components/schemas/HomeRegion'
            - type: 'null'
        created_at: { type: string, format: date-time }
        is_guest: { type: boolean, description: Анонімний вхід (ADR-001) }
        onboarding:
          type: object
          required: [region_done, terms_done, terms_version, next_step, next_step_label]
          properties:
            region_done: { type: boolean }
            terms_done: { type: boolean }
            terms_version: { type: string }
            next_step: { type: string, enum: [select_region, accept_terms, profile, done] }
            next_step_label: { type: string }
        region_change:
          type: object
          required: [allowed, reason_label]
          properties:
            allowed: { type: boolean }
            reason_label: { type: string }

    MeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Me' }

    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 30, description: "Українськими літерами" }
        handle: { type: string, minLength: 3, maxLength: 20, description: "Нік без «@», українськими літерами" }
        avatar:
          type: object
          required: [kind, id]
          description: 'Готовий аватар зі списку; невідомий — 400 invalid_avatar, ще не відкритий рівнем — 403 avatar_locked'
          properties:
            kind: { type: string, enum: [preset] }
            id: { type: string }
        home_region_slug: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,31}$' }
        accept_terms_version: { type: string }

    PickUploadUrlRequest:
      type: object
      required: [client_id, content_type, size_bytes]
      properties:
        client_id:
          type: string
          format: uuid
          description: UUID, який генерує клієнт; ключ ідемпотентності обох кроків
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, minimum: 1, maximum: 5242880 }

    PickUploadUrl:
      type: object
      required: [upload_url, path, token, expires_at]
      properties:
        upload_url: { type: string, format: uri, description: Сюди клієнт робить PUT файлу }
        path:
          type: string
          description: Передати без змін у POST /v1-picks
          example: 11111111-1111-4111-8111-111111111111/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jpg
        token: { type: string, description: Токен посилання (для SDK uploadToSignedUrl) }
        expires_at: { type: string, format: date-time }

    PickAiCheck:
      type: object
      description: |
        Підказка локального ШІ з телефону (ADR-018 §18.4). Не доказ — сервер лише зберігає її.
        Числові ймовірності заборонені: тільки рівні.
      required: [model_version, top, match, twin_alert]
      properties:
        model_version: { type: string, minLength: 1, maxLength: 64 }
        top:
          type: array
          maxItems: 5
          items:
            type: object
            required: [species_id, level]
            properties:
              species_id: { type: string, maxLength: 64 }
              level: { type: string, enum: [high, medium, low] }
        match: { type: boolean, description: Розпізнаний вид збігається з обраною назвою }
        twin_alert:
          type: boolean
          description: Модель бачить отруйного двійника — точка не підтверджується автоматично

    CreatePickRequest:
      type: object
      required: [client_id, path, lat, lng, captured_at, visibility, species_id]
      properties:
        client_id: { type: string, format: uuid }
        path: { type: string, description: '`path` з відповіді upload-url' }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        captured_at: { type: string, format: date-time, description: Час зйомки на пристрої }
        visibility: { type: string, enum: [private, public] }
        species_id:
          type: [string, 'null']
          maxLength: 64
          description: id виду з довідника; `null` — «Не знаю, що це» (лише для `private`)
        description:
          type: [string, 'null']
          maxLength: 500
          description: Необов'язковий опис; контакти й посилання замінюються на «…»
        reply_to:
          type: [string, 'null']
          format: uuid
          description: Відповідь знахідкою на чужу публічну точку (B3.8) — лише з `visibility = public`
        location_mocked:
          type: [boolean, 'null']
          description: >-
            Телефон повідомив, що місце підмінене програмою (Android mock location). Відповідь знахідкою зараховується
            лише з `false`; `true` або без поля — точку створено, але підтвердження немає (B3.8b).
        ai_check:
          oneOf:
            - $ref: '#/components/schemas/PickAiCheck'
            - type: 'null'

    PickCreated:
      type: object
      description: Підписи й кольори — готові, із сервера. Координат у відповіді немає.
      required: [id, visibility, status_label, marker_color]
      properties:
        id: { type: string, format: uuid }
        visibility: { type: string, enum: [private, public] }
        status_label:
          type: string
          description: '«Приватна точка» · «Перевіряється» · «Підтверджено» · «Відхилено»'
          example: Перевіряється
        marker_color: { type: string, pattern: '^#[0-9a-f]{6}$', example: '#9e9e9e' }
        confirmation:
          type: object
          description: Лише для відповіді знахідкою (`reply_to`, B3.8) — чи зараховано і чому, словами
          properties:
            counted: { type: boolean }
            label: { type: string, example: 'Дякуємо! Ви підтвердили точку своєю знахідкою' }

    PickCreatedResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PickCreated' }

    MapPick:
      type: object
      description: Точка на карті. Підпис і колір — із сервера.
      required: [id, lat, lng, is_exact, is_mine, visibility, name_label, status_label, marker_color]
      properties:
        id: { type: string, format: uuid }
        lat: { type: number, description: Своя точка — точна широта; чужа — зсунута }
        lng: { type: number }
        is_exact: { type: boolean, description: true лише для власних точок }
        is_mine: { type: boolean }
        visibility: { type: string, enum: [private, public] }
        species_id: { type: [string, 'null'] }
        name_label: { type: string, example: Білий гриб, description: 'Назва виду або «Не знаю, що це»' }
        status_label: { type: string, example: Перевіряється }
        marker_color: { type: string, pattern: '^#[0-9a-f]{6}$', example: '#9e9e9e' }

    PickCard:
      allOf:
        - $ref: '#/components/schemas/MapPick'
        - type: object
          required: [actions]
          properties:
            description: { type: [string, 'null'] }
            date_label: { type: [string, 'null'], example: 10 листопада 2026 р. }
            captured_at:
              type: [string, 'null']
              format: date-time
              description: Точний час зйомки — лише для власної точки
            photo_url:
              type: [string, 'null']
              format: uri
              description: Тимчасове посилання на фото (10 хвилин)
            confirmed_label:
              type: [string, 'null']
              example: 'Підтвердили 2 грибники, останнє — 20 листопада 2026 р.'
              description: Відповіді знахідкою (B3.8, ADR-019 §19.5); без підтверджень — null
            confirmed_by_me: { type: boolean, description: Ви вже підтвердили цю точку }
            twin_warning_label:
              type: [string, 'null']
              description: Публічна точка з twin_alert — попередження лишається й після підтвердження
            disclaimer_label:
              type: [string, 'null']
              example: Фото користувача — не порада їсти гриб
            actions:
              type: array
              description: |
                Дозволені дії; клієнт показує лише їх. Своя точка (B3.4): `open_in_maps` (відкрити точне місце в
                Google Картах — замість файлу-експорту), `make_public` (приватна з видом),
                `make_private` (публічна), `edit_description`, `delete`. Чужа публічна — `reply_found` («Я теж знайшов тут»,
                B3.8b), лише якщо сервер дозволяє: акаунт, публічні дозволені (рівень, ліміт), ще не підтверджено, є спроби.
              items: { type: string, enum: [reply_found, open_in_maps, make_public, make_private, edit_description, delete] }

    AnalysisUsage:
      type: object
      required: [used, limit, label]
      properties:
        used: { type: integer }
        limit: { type: integer }
        label: { type: string, example: 'Сьогодні: 2 з 5 аналізів' }

    AnalysisArea:
      type: object
      required: [id, slot, lat, lng, size_km, size_label]
      properties:
        id: { type: string, format: uuid }
        slot: { type: integer, minimum: 1, maximum: 3 }
        lat: { type: number }
        lng: { type: number }
        size_km: { type: integer, enum: [5, 10] }
        size_label: { type: string, example: 5×5 км }
        label: { type: [string, 'null'], maxLength: 24, description: Назва від грибника (у GET); null — «Ділянка N» }
        title: { type: string, example: Біля Броників, description: Готовий підпис клітинки (у GET) }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: '[minLng, minLat, maxLng, maxLat] — точні межі проаналізованого квадрата (у відповіді POST)'
        usage: { $ref: '#/components/schemas/AnalysisUsage' }
        last_result:
          description: Останній результат аналізу ділянки (у GET); null — ще не аналізували
          oneOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - type: 'null'
        last_analyzed_at: { type: [string, 'null'], format: date-time }
        forest_override:
          description: Уточнення лісу вручну (у GET); null — немає
          oneOf:
            - $ref: '#/components/schemas/ForestOverride'
            - type: 'null'
        forest_edit: { $ref: '#/components/schemas/ForestEditUsage' }

    ForestSpeciesCode:
      type: string
      enum: [pine, spruce, oak, birch, aspen, alder, beech, hornbeam]

    ForestOverride:
      type: object
      description: Породи, обрані користувачем для своєї ділянки (ADR-015 §15.6)
      properties:
        types:
          type: array
          maxItems: 12
          items:
            type: object
            required: [forest_type, species]
            properties:
              forest_type: { type: [string, 'null'], pattern: '^[a-z_]{1,32}$', description: Тип лісу з карти }
              species:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items: { $ref: '#/components/schemas/ForestSpeciesCode' }
        extra:
          type: array
          maxItems: 4
          items:
            type: object
            required: [species, presence]
            properties:
              species: { $ref: '#/components/schemas/ForestSpeciesCode' }
              presence: { type: string, enum: [dominant, present] }

    ForestEditUsage:
      type: object
      required: [used, limit, can_edit, label]
      properties:
        used: { type: integer }
        limit: { type: integer, example: 2 }
        can_edit: { type: boolean }
        label: { type: string, example: Уточнити ліс сьогодні можна ще 1 раз }

    AnalysisOverview:
      type: object
      required: [sizes, areas, usage, hint_label]
      properties:
        sizes:
          type: array
          items:
            type: object
            required: [size_km, label, available]
            properties:
              size_km: { type: integer, enum: [5, 10] }
              label: { type: string, example: 10×10 км }
              available: { type: boolean }
              lock_label: { type: [string, 'null'], example: Доступно в Pro }
        areas:
          type: array
          items: { $ref: '#/components/schemas/AnalysisArea' }
        usage: { $ref: '#/components/schemas/AnalysisUsage' }
        hint_label: { type: string, example: 'Торкніться карти, щоб обрати центр ділянки' }
        can_create: { type: boolean, description: Чи є вільний слот для нової ділянки }
        create_hint_label:
          type: string
          example: 'У вас уже є ділянка. Щоб створити нову, видаліть стару у вкладці «Прогноз».'
        slots:
          type: array
          description: Три клітинки ділянок у «Прогнозі» (ADR-015 §15.9)
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [slot, state, area_id, title, subtitle]
            properties:
              slot: { type: integer, minimum: 1, maximum: 3 }
              state: { type: string, enum: [area, empty, locked], description: 'зайнята / вільна (Pro) / під замком Pro' }
              area_id: { type: [string, 'null'], format: uuid }
              title: { type: string, example: Ділянка 1 }
              subtitle: { type: [string, 'null'], example: 5×5 км }
              locked_label: { type: string, example: Ще 2 ділянки — у Pro }
        label_max: { type: integer, example: 24, description: Найдовша назва ділянки, символів }
        forest_edit_options:
          type: object
          description: Список для «Уточнити ліс» (лише вибір зі списку)
          properties:
            species:
              type: array
              items:
                type: object
                required: [code, label]
                properties:
                  code: { $ref: '#/components/schemas/ForestSpeciesCode' }
                  label: { type: string, example: Сосна }
            presence:
              type: array
              items:
                type: object
                required: [code, label]
                properties:
                  code: { type: string, enum: [dominant, present] }
                  label: { type: string, example: є місцями }

    AnalysisRequest:
      type: object
      description: Або `area_id` (повторний аналіз), або `lat` + `lng` + `size_km` (нова ділянка).
      properties:
        area_id: { type: string, format: uuid }
        refresh:
          type: string
          enum: [daily, weather]
          description: >-
            З `area_id`: `daily` — щоденне оновлення без списання аналізу раз на київську добу
            або коли збережений результат старішої версії (`result_version`); `weather` — лише
            погода без списання, не частіше ніж раз на 3 години; інакше `409 already_fresh`.
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        size_km: { type: integer, enum: [5, 10] }
        date: { type: string, format: date, description: За замовчуванням — сьогодні (київський час) }
        forest:
          type: object
          description: >-
            Ліс у квадраті, порахований застосунком із полігонів, які видно на карті
            (файл лісів області). Якщо передано — замінює дані БД (там є не всі області).
          required: [forest_km2, types]
          properties:
            forest_km2: { type: number, minimum: 0 }
            types:
              type: array
              maxItems: 12
              items:
                type: object
                required: [forest_type, km2]
                properties:
                  forest_type: { type: [string, 'null'], pattern: '^[a-z_]{1,32}$' }
                  km2: { type: number, minimum: 0 }

    AnalysisSpecies:
      allOf:
        - $ref: '#/components/schemas/ForecastSpecies'
        - type: object
          properties:
            forest_label:
              type: [string, 'null']
              example: Сосновий ліс
              description: У якому лісі ділянки шукати цей вид

    AnalysisResult:
      type: object
      required: [area, date, forest, warnings, usage]
      properties:
        area: { $ref: '#/components/schemas/AnalysisArea' }
        date: { type: string, format: date }
        forest:
          type: object
          required: [summary_label, types]
          properties:
            summary_label: { type: string, example: 'Ліс займає ≈ 9,4 км² з 25 км² ділянки' }
            types:
              type: array
              maxItems: 5
              items:
                type: object
                required: [type_label, type_color, area_label]
                properties:
                  forest_type: { type: [string, 'null'] }
                  type_label: { type: string, example: Сосновий ліс }
                  type_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
                  area_label: { type: string, example: '≈ 8,4 км²' }
                  age_label: { type: [string, 'null'], example: '~60 р.' }
                  species:
                    type: array
                    items: { $ref: '#/components/schemas/ForestSpeciesCode' }
                  species_label: { type: [string, 'null'], example: 'сосна, ялина · уточнено вами' }
            extra:
              type: array
              items:
                type: object
                required: [species, label, presence, presence_label]
                properties:
                  species: { $ref: '#/components/schemas/ForestSpeciesCode' }
                  label: { type: string, example: Дуб }
                  presence: { type: string, enum: [dominant, present] }
                  presence_label: { type: string, example: є місцями · уточнено вами }
            refined: { type: boolean, description: Ліс уточнено вручну }
            refine_note_label: { type: [string, 'null'] }
        top1:
          oneOf:
            - $ref: '#/components/schemas/AnalysisSpecies'
            - type: 'null'
        alternative:
          oneOf:
            - $ref: '#/components/schemas/AnalysisSpecies'
            - type: 'null'
        weather:
          description: Погода обраного дня (базова, безкоштовно) — температура, вологість, опади
          oneOf:
            - $ref: '#/components/schemas/AnalysisDayWeather'
            - type: 'null'
        weather_as_of:
          type: string
          format: date-time
          description: Коли погодну частину результату було розраховано
        weather_fresh_until:
          type: string
          format: date-time
          description: 'До якого часу повторне `refresh: weather` ще не потрібне'
        warnings: { type: array, items: { type: string } }
        usage: { $ref: '#/components/schemas/AnalysisUsage' }
        no_data_reason: { type: string }
        days:
          type: array
          description: >-
            ADR-015 §15.7: усі дні горизонту від сьогодні (безкоштовно 3, Pro 7) з одного аналізу.
            Поля верхнього рівня (top1, weather…) — для `date`.
          maxItems: 7
          items: { $ref: '#/components/schemas/AnalysisDay' }
        horizon_days: { type: integer, enum: [3, 7] }
        best_day:
          description: Найвищий рівень (від «Середньої»); `null` — немає дня, вартого виїзду
          oneOf:
            - type: object
              required: [date, label]
              properties:
                date: { type: string, format: date }
                label: { type: string, example: 'Найкращий день: субота' }
            - type: 'null'
        locked_days:
          type: array
          description: Дні 4–7 у безкоштовній версії — лише дата й підпис, без прогнозу
          items:
            type: object
            required: [date, day_label]
            properties:
              date: { type: string, format: date }
              day_label: { type: string, example: Сб 14 }
        locked_label: { type: [string, 'null'], example: 'Ще 4 дні прогнозу — у Pro' }
        basket:
          description: Кошик мінікарти — гриби зі шансом обраного дня (ADR-015 §15.9)
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/AnalysisBasketSpecies' }
        week_animation:
          type: object
          required: [allowed]
          description: «Хвиля по днях» — Pro або рівень «Слідопит»; інакше locked_label при натисканні
          properties:
            allowed: { type: boolean }
            locked_label: { type: [string, 'null'], example: 'Анімація тижня — у Pro або з рівня «Слідопит»' }
        result_version: { type: integer, example: 3, description: Старіший збережений результат оновлюється безкоштовно }
        identify:
          type: object
          description: «Як відрізнити» — один раз на вид (ключ — mushroom_type), не в кожному дні
          additionalProperties: { type: object }
        others:
          type: array
          description: «Інші гриби сезону» обраного дня (у days[] — для кожного дня)
          items:
            type: object
            properties:
              mushroom_type: { type: string }
              name_ua: { type: string }
              reason_label: { type: string, example: 'Холодно: 3° за тиждень, потрібно від 10°' }
              group: { type: string, enum: [today, season] }
        finds:
          type: [object, 'null']
          description: Знахідки в ділянці — звірка ваших тук-туків за 60 днів із прогнозом того дня і ваші знахідки торік у ці тижні (лише власні)
          properties:
            verification: { type: [object, 'null'], properties: { matched: { type: integer }, total: { type: integer } } }
            verification_label: { type: [string, 'null'], example: 'Ваші знахідки тут збіглися з прогнозом: 2 з 3' }
            last_year:
              type: array
              maxItems: 30
              items:
                type: object
                properties:
                  lat: { type: number }
                  lng: { type: number }
                  mushroom_type: { type: string }
                  name: { type: string }
                  date_label: { type: string, example: '12.11.2025' }
            last_year_label: { type: [string, 'null'], example: 'Торік у ці тижні: 3 знахідки' }
        weather_insight:
          type: [object, 'null']
          description: «Розширені дані погоди» — дощ → гриби, що сталося, шкали, що далі (ADR-015 §15.8 п.9)
          properties:
            strip_title: { type: string, example: 'Дощі й гриби' }
            days:
              type: array
              description: 14 днів до сьогодні й дні горизонту
              items:
                type: object
                required: [date, label, date_label, rain, soaking, temp, forecast, today]
                properties:
                  date: { type: string, format: date }
                  label: { type: string, example: Пн }
                  date_label: { type: string, example: '16' }
                  rain: { type: number, description: мм за добу }
                  soaking: { type: boolean, description: Дощ промочив ґрунт (поштовх) }
                  temp: { type: string, enum: [frost, cold, ok, hot] }
                  forecast: { type: boolean }
                  today: { type: boolean }
            wave:
              type: [object, 'null']
              properties:
                from: { type: string, format: date }
                to: { type: [string, 'null'], format: date }
                label: { type: string, example: 'Зимовий опеньок: гриби 13.11–02.12' }
            legend_labels: { type: object, additionalProperties: { type: string } }
            events_title: { type: string }
            events:
              type: array
              maxItems: 3
              items:
                type: object
                properties:
                  icon: { type: string, enum: [rain, frost, thaw, dry] }
                  label: { type: string, example: 'Дощ 9 мм, 13.11 — ґрунт промочило' }
            gauges:
              type: array
              items:
                type: object
                required: [key, title, tone]
                properties:
                  key: { type: string, enum: [soil, warmth, rain14] }
                  title: { type: string }
                  steps: { type: array, items: { type: string } }
                  index: { type: integer }
                  hint: { type: [string, 'null'] }
                  value_label: { type: string, example: '25 мм — достатньо' }
                  fill: { type: number, minimum: 0, maximum: 1 }
                  mark: { type: number, minimum: 0, maximum: 1 }
                  mark_label: { type: string }
                  tone: { type: string, enum: [good, neutral, bad] }
            outlook_title: { type: string }
            outlook_label: { type: string, example: 'Вт 17 — дощ 9 мм: підтримає хвилю' }

    AnalysisBasketSpecies:
      type: object
      required: [mushroom_type, name_ua, level, level_label, level_color]
      properties:
        mushroom_type: { type: string }
        name_ua: { type: string, example: Білий гриб }
        level: { type: string, enum: [peak, high, medium, low] }
        level_label: { type: string }
        level_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
        when_label: { type: string, example: 'Хвиля зараз — 3-й день з 10' }

    AnalysisDayWeather:
      type: object
      required: [icon, temp_label, humidity_label, rain_label]
      properties:
        icon: { type: string, enum: [sun, cloud, rain, snow, fog, unknown], description: За погодою самого дня }
        day_label: { type: [string, 'null'], example: '4…11°, опади 8 мм', description: Погода самого дня }
        temp_label: { type: string }
        humidity_label: { type: string }
        rain_label: { type: string }
        verdict_label: { type: [string, 'null'], example: 'Ґрунт вологий після дощів — добре для грибів', description: Що погода означає для грибів }
        verdict_tone: { type: [string, 'null'], enum: [good, neutral, bad, null] }
        scene:
          type: [string, 'null']
          enum: [sunny, partly_cloudy, cloudy, rain, heavy_rain, fog, frost, snow, heat, null]
          description: Анімована сцена з грибом-маскотом (код погоди WMO дня; без нього — за опадами й вологістю)
        scene_label: { type: [string, 'null'], example: Мінлива хмарність }
        sprouts: { type: string, enum: [none, few, many], description: Молоді гриби в сцені — за стадією хвилі найкращого виду }
        range_label: { type: [string, 'null'], example: 'Різні моделі: опади 2–11 мм, 3…10°', description: Дні 5–7 (Pro) — діапазон за ансамблем моделей }
        sun_label: { type: [string, 'null'], example: 'Схід 07:12 · захід 16:08 · світла 8 год 56 хв' }
        take_label: { type: [string, 'null'], example: 'Візьміть: дощовик, гумові чоботи' }
        parts:
          type: array
          description: Частини доби з окремою погодною сценою й температурою
          items:
            type: object
            required: [key, label, from_hour, to_hour, scene, scene_label, temp_label]
            properties:
              key: { type: string, enum: [night, morning, day, evening] }
              label: { type: string, example: Ранок }
              from_hour: { type: integer, minimum: 0, maximum: 23 }
              to_hour: { type: integer, minimum: 1, maximum: 24 }
              scene: { type: string }
              scene_label: { type: string, example: Сонячно }
              temp_label: { type: string, example: '5…11°' }
        rain_spans:
          type: array
          description: Проміжки опадів протягом доби
          items:
            type: object
            required: [from_hour, to_hour, label]
            properties:
              from_hour: { type: integer, minimum: 0, maximum: 23 }
              to_hour: { type: integer, minimum: 1, maximum: 24 }
              label: { type: string, example: 'Дощ 18:00–21:00, ~5 мм' }
        dry_rest_label: { type: [string, 'null'], example: Далі сьогодні без опадів }
        hazards:
          type: array
          description: Готові попередження про грозу, спеку або заморозок
          items: { type: string }

    AnalysisDay:
      type: object
      required: [date, day_label, approximate, level, level_label, level_short_label, level_color, warnings]
      properties:
        date: { type: string, format: date }
        day_label: { type: string, example: Сьогодні }
        approximate: { type: boolean, description: Дні 5–7 — прогноз погоди менш точний }
        approximate_label: { type: [string, 'null'] }
        level: { type: string, enum: [peak, high, medium, low, no_data], description: Рівень найкращого виду дня }
        level_label: { type: string, example: Висока ймовірність }
        level_short_label: { type: string, example: Висока, description: Для смужки днів }
        level_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
        top1:
          oneOf:
            - $ref: '#/components/schemas/AnalysisSpecies'
            - type: 'null'
        alternative:
          oneOf:
            - $ref: '#/components/schemas/AnalysisSpecies'
            - type: 'null'
        weather:
          oneOf:
            - $ref: '#/components/schemas/AnalysisDayWeather'
            - type: 'null'
        warnings: { type: array, items: { type: string } }
        no_data_reason: { type: [string, 'null'] }
        basket:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/AnalysisBasketSpecies' }
        others:
          type: array
          description: Інші гриби для цього дня з готовою причиною
          items:
            type: object
            properties:
              mushroom_type: { type: string }
              name_ua: { type: string }
              reason_label: { type: string }
              group: { type: string, enum: [today, season] }

    RegionGeometry:
      type: object
      required: [id, slug, name, bbox, center, zoom, geometry, forests]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: '[minLng, minLat, maxLng, maxLat]'
        center:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: '[lng, lat]'
        zoom: { type: integer, minimum: 5, maximum: 12 }
        geometry: { type: object, description: GeoJSON MultiPolygon }
        forests:
          type: object
          description: |
            Ліси області одним файлом (той самий формат, що й /v1-forest-zones, gzip).
            Застосунок перевіряє meta (version) і завантажує data_url лише при зміні версії.
            Якщо файлу ще немає (404) — запасний шлях /v1-forest-zones.
          required: [meta_url, data_url]
          properties:
            meta_url: { type: string, format: uri }
            data_url: { type: string, format: uri }

        basemap:
          type: object
          description: >-
            Карта-підкладка області для роботи без інтернету (PMTiles, схема OpenMapTiles; пілот).
            Застосунок качає її один раз; немає опису (404) — карти для області ще немає.
          required: [meta_url, data_url]
          properties:
            meta_url: { type: string, format: uri }
            data_url: { type: string, format: uri }

        trails:
          type: object
          description: >-
            Мережа доріг і стежок області з водою й болотами (двійковий граф MRT1, gzip) — маршрут
            «Додому» прокладається на телефоні без інтернету (ADR-022 §22.7). Качається разом з картою.
          required: [meta_url, data_url]
          properties:
            meta_url: { type: string, format: uri }
            data_url: { type: string, format: uri }
    ForestFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              id: { type: string }
              geometry: { type: object }
              properties:
                type: object
                required: [id, type_label, type_color]
                properties:
                  id: { type: string }
                  forest_type: { type: [string, 'null'] }
                  stand_age_years: { type: [integer, 'null'] }
                  type_label: { type: string }
                  type_color: { type: string, pattern: '^#[0-9a-f]{6}$' }

    ForecastRequest:
      type: object
      required: [lat, lng, date]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        date: { type: string, format: date }
        forestType: { type: string, maxLength: 32 }

    ForecastSpecies:
      type: object
      required: [mushroom_type, name_ua, level, level_label, level_color, when_label, where_label, why_labels]
      properties:
        mushroom_type: { type: string }
        name_ua: { type: string }
        level: { type: string, enum: [peak, high, medium, low, no_data] }
        level_label: { type: string }
        level_color: { type: string }
        when_label: { type: string, example: 'Зараз — 3 дні після дощу · Осіння хвиля' }
        where_label: { type: string }
        why_labels:
          type: array
          maxItems: 4
          items: { type: string }
          example: ['Температура 13° — підходить для плодоношення', 'Дощ 16 мм за останні 3 дні']
        limit_labels:
          type: array
          maxItems: 4
          description: Що знижує рівень (показується з попередженням, не з «✓»)
          items: { type: string }
        reason_label:
          type: [string, 'null']
          example: 'Чому середня: хвиля тільки починається — гриби ще дрібні й поодинокі'
          description: Одне речення — чому саме такий рівень
        wave:
          type: [object, 'null']
          description: Хвиля плодоношення для смужки — день і стадії, без чисел сили хвилі
          properties:
            phase: { type: string, enum: [flush, maturing, after, idle] }
            label: { type: [string, 'null'], example: 'Хвиля зараз — 3-й день з 20' }
            day: { type: integer }
            days: { type: integer }
            stage: { type: [string, 'null'], enum: [rise, peak, decline, null] }
            segments:
              type: array
              items:
                type: object
                properties:
                  days: { type: integer }
                  label: { type: string, example: розпал }
        identify:
          type: [object, 'null']
          description: «Як відрізнити» — з довідника (scripts/catalog_sync/identify.py)
          properties:
            features:
              type: array
              items:
                type: object
                properties:
                  part: { type: string, enum: [cap, underside, stem, flesh] }
                  title: { type: string, example: Ніжка }
                  text: { type: string, example: 'Головна ознака — білувате плівчасте кільце' }
                  kind: { type: [string, 'null'], enum: [tubes, gills, folds, spines, null] }
            cap_colors:
              type: array
              items: { type: object, properties: { hex: { type: string }, label: { type: string } } }
            underside: { type: [string, 'null'], enum: [tubes, gills, folds, spines, null] }
            ring: { type: [boolean, 'null'] }
            twin:
              type: [object, 'null']
              properties:
                name: { type: string, example: Галерина облямована }
                danger: { type: string, enum: [similar, inedible, poisonous, deadly] }
                danger_label: { type: string, example: Смертельно отруйний! }
                diffs:
                  type: array
                  items:
                    type: object
                    properties:
                      feature: { type: string }
                      ours: { type: string }
                      twin: { type: string }
            rule: { type: [string, 'null'] }
          example: ['Вологість 55% — замало (краще від 70%)', 'Сухий ґрунт']

    ForecastWeather:
      type: object
      description: Блок погоди з готовими рядками (B2.3). null, якщо погода недоступна.
      required: [icon, temp_label, humidity_label, rain_label, rain_recent_label, pressure_label]
      properties:
        icon: { type: string, enum: [sun, cloud, rain, unknown] }
        temp_label: { type: string, example: '9°…17°, у середньому 13° за тиждень' }
        humidity_label: { type: string, example: 'Вологість 78%' }
        rain_label: { type: string, example: 'Опади: 16 мм за 3 дні, 21 мм за тиждень' }
        rain_recent_label: { type: string, example: 'Сильний дощ 3 дні тому' }
        pressure_label: { type: string, example: 'Тиск 1013 гПа, стабільний' }

    Forecast:
      type: object
      required: [date, forest, forest_label, warnings]
      properties:
        regionName: { type: [string, 'null'] }
        date: { type: string, format: date }
        forest: { type: string, description: Технічний рядок рушія (застаріле — використовуйте forest_label) }
        forest_label: { type: string, example: 'Сосновий ліс' }
        weather:
          oneOf:
            - $ref: '#/components/schemas/ForecastWeather'
            - type: 'null'
        top1:
          oneOf:
            - $ref: '#/components/schemas/ForecastSpecies'
            - type: 'null'
        alternative:
          oneOf:
            - $ref: '#/components/schemas/ForecastSpecies'
            - type: 'null'
        warnings: { type: array, items: { type: string } }
        noDataReason: { type: string }
